# Team overrides for bmad-build (committed).
# Epic 4 retro, action item 5 (process lesson L1): specs silently narrowed or
# deferred epic acceptance criteria inside approved frozen blocks, and review
# compared code to the spec, never the spec to the epic.

[workflow]

persistent_facts = [
  "EPIC AC DEVIATIONS. When the intent is an epic story, or a fix tied to an epic's acceptance criteria, the spec's <frozen-after-approval> block must end with a `## Epic AC Deviations` section, so the human approves it with the intent. List every epic AC the spec defers, narrows or reinterprets. For each one, quote the epic AC, give the spec's choice and say why. If there are none, write the single line `None.`. Every DEFERRED epic AC also gets a `deferred-work.md` entry, written during planning (step 02), not left for review.",
  # Epic 10 retro, action A13 (P2, P3; epic 8-9 retro item 8 / epic-9-retro-item-23).
  "SPINE AMENDMENTS ARE TASKS. A spec that amends an architecture decision (AD-x), or cites an AD amendment as its justification, carries an Execution task that edits `_bmad-output/planning-artifacts/architecture/architecture-shift-2026-09-02/ARCHITECTURE-SPINE.md` in the same change, adding an `Amended <date> (<story>)` clause to that AD. Citing an amendment that no task writes is a defect.",
  "DEFERRALS ADDRESSED TO A STORY ARE ITS INPUTS. A `deferred-work.md` entry that says \"decide in story X\" (or \"X should …\", or names X as where it lands) is copied into X's spec as a required input, listed in the spec (Boundaries or Design Notes) with its answer. Story X cannot reach `done` while such an entry is unanswered: either the spec answers it, or the human records a new owner in the entry.",
  # Epic 15 retro A4 (item 32): CI is the e2e gate when port 5173 is taken.
  "LOCAL E2E HAS A STOP RULE. Never start a second Vite on another port to run e2e locally. If port 5173 is held by another checkout or session, do not run local e2e at all: CI is the e2e gate. If a local e2e run fails twice on the same test for an environmental reason (port, shared stack, timing), stop and leave it to CI instead of looping.",
  # Epic 15 retro A5 (item 33) / epic 11 retro A4 (item 39).
  "HOT FILES ARE SEQUENTIAL. Stories that touch the hot files (`apps/web/src/index.css`, `apps/web/src/components/ui/*`, `chrome.tsx`, `test/theme-contrast.test.ts`, the structural pin tests, `hr.json`) never run in parallel from one baseline. Start the next such story from the previous one's merge, and say so in the spec's baseline line.",
  # Epic 11 retro A3 (item 38).
  "A COLOUR TOKEN'S CONTRAST SPEC LISTS EVERY SURFACE. A spec that adds or moves a colour token lists every surface the token is drawn on or against, glass surfaces (Dialog, Popover, Sheet, the chrome) included, with each one's measured ratio. Each one is pinned in `test/theme-contrast.test.ts`, a known shortfall is pinned exactly, and none may be found only in review.",
  # Epic 12 retro A4 (P1): the 12.1 subagent committed schema to the shared stack.
  "STRICT DATABASE RULE. The local Supabase stack is shared by parallel sessions and is never changed by a story. Never apply a migration to it in any form (`supabase migration up`, `db reset`, `psql`, or SQL run inside a test), never patch a test harness (`test/database.ts`, `e2e/utils/*`) to apply one, and never run a DB-connecting root test file (`rls-isolation`, `concurrent-writes`, `provisioning`, `demo-organization`, …) against it: some commit in `afterAll`, so a \"rolled-back\" apply is committed, unrecorded in `schema_migrations`. Read-only queries only. DB tests for a new migration are verified in CI, on its fresh stack; a local failure caused by the unapplied migration is expected and is said so in the spec's Verification.",
  # Epic 12 retro A5 (P2): #280 failed 21 e2e tests on foreign keys from the cleanup.
  "A NEW TABLE WITH FOREIGN KEYS EXTENDS THE E2E CLEANUP. A story whose migration adds a table that references existing rows (`members`, `teams`, `roster_overrides`, …) extends `e2e/utils/database-helper.ts` in the same change, so every cleanup that deletes those rows first deletes the new table's rows (and their outbox rows by subject), in foreign-key order, in the same transaction.",
  # Epic 12 retro A5 (P2): #278 failed on a 12.2 e2e step that still expected the old surface.
  "A CHANGE TO WHAT A SURFACE SHOWS GREPS E2E FOR THE OLD BEHAVIOUR. A story that changes what a surface shows or offers (a control replaced by a notice, a label or route changed) searches `e2e/` for the old text, role or route and updates every spec that asserts it, in the same change, so one stale step does not hold a shared e2e lock and time out unrelated specs.",
  "RESOLVED DEFERRALS ARE MARKED IN THE SAME CHANGE. A story that resolves a `deferred-work.md` entry, wholly or in part, prefixes that entry with `RESOLVED by <story> (<date>) — `, or for a part `RESOLVED in part (<which part>) by <story> (<date>) — ` naming what stays open, in the same change that resolves it.",
]

[[workflow.review_layers]]
id = "epic-ac-auditor"
name = "Epic AC Auditor"
instruction = """
Launch a context-free subagent with this prompt:

You are an Epic AC Auditor. The content below is a diff that includes a spec file (`spec-*.md` under `_bmad-output/implementation-artifacts/`).
1. Find that spec in the diff. If it names no epic story, and no epic or retro its intent traces to, reply `Not an epic story.` and stop.
2. Otherwise open `{project-root}/_bmad-output/planning-artifacts/epics.md` and read the acceptance criteria of the story the spec implements.
3. Check every one of those epic ACs against the spec AND the code in the diff.
4. Report each epic AC that the result does not meet, or meets only partly. Mark whether the spec's `## Epic AC Deviations` section lists it. An unlisted deviation is a finding even if the code matches the spec.
5. Also report each listed DEFERRED AC that has no `deferred-work.md` entry.

Output a Markdown list. Each item gives: the epic AC (quoted briefly), met / partly / not met, whether it is listed, and the evidence from the diff.

CONTENT:
{diff_output}

Do not invoke any skill. Return only the review result.
"""
