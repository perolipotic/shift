<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift</title>
    <!-- Static Croatian, like the title and the boot fallback: crawlers and
         link previews read it without running the bundle. `lang` on <html> is
         only the pre-script default; `lib/i18n/document-language.ts` rewrites
         it from the active locale. The two theme colours are `--background` in
         each theme (`index.css`), as hex because the browser chrome reads
         them, not the page. -->
    <meta
      name="description"
      content="Planiranje dežurstava, odsustava i pokrivenosti za dobrovoljna vatrogasna društva."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1829" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The theme, resolved before the first paint. `data-theme` on <html> is
         always `light` or `dark`; `index.css` hangs the dark tokens on it. The
         preference (`system`, `light`, `dark`) lives in localStorage under
         `shift.theme`, written by `src/lib/theme.ts`, which holds the same
         key and values. Inline and synchronous, because a pinned dark theme
         read after the bundle loads is a white flash on every visit.

         It also owns following the OS while the preference is `system`: the
         listener re-reads storage on each change, so a pin made in the app
         after this ran is respected without the app unsubscribing anything.

         Storage can throw; every failure resolves as `system`. With scripting
         disabled nothing runs and the page is light, which is the only
         surface that can be reached that way — the boot fallback. -->
    <script>
      (function () {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          var stored = null;
          try {
            stored = window.localStorage.getItem('shift.theme');
          } catch (e) {}
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : query.matches ? 'dark' : 'light';
        }
        apply();
        query.addEventListener('change', apply);
      })();
    </script>
    <!-- The boot fallback's own styling, inline in the document head and
         nowhere else. It cannot live in `index.css`: the two failures it
         covers are the bundle never loading and the translation layer refusing
         to start, and in the first of those no external stylesheet has been
         fetched either.

         `opacity: 0` plus a delayed animation, and no JavaScript anywhere in
         it. Painted immediately — which is what it did before review — the
         fallback shows a Croatian error telling the user to refresh on EVERY
         slow load, including the ones that were about to succeed. A CSS
         animation with a delay and no duration is the only mechanism that
         reveals it late while still working with scripting disabled: the
         element stays invisible, and if the application has not mounted and
         cleared `#root` within the delay, it steps into view. A successful
         mount removes the element long before that.

         `visibility: hidden` rides alongside `opacity: 0`. Opacity alone does
         not remove an element from the accessibility tree, so a screen reader
         reading through the page during the delay — or during a genuinely
         slow load — could announce the Croatian failure message on a boot
         that is about to succeed. `visibility` is animatable the same way:
         the keyframe flips it to `visible` at the same instant opacity
         reaches 1, so it stays unannounced until it is actually the answer. -->
    <style>
      #boot-fallback {
        margin: 0;
        padding: 2rem;
        text-align: center;
        font: 1rem/1.5 system-ui, sans-serif;
        opacity: 0;
        visibility: hidden;
        animation: boot-fallback-reveal 0s linear 3s forwards;
      }

      @keyframes boot-fallback-reveal {
        to {
          opacity: 1;
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <!-- Nothing works without scripting. The boot fallback below would also
         surface after its delay and ask for a refresh, which cannot help, so
         it is hidden here and this names the actual cause. -->
    <noscript>
      <style>
        #boot-fallback {
          display: none;
        }
      </style>
      <p style="margin: 0; padding: 2rem; text-align: center; font: 1rem/1.5 system-ui, sans-serif">
        Shift ne radi bez JavaScripta. Uključi JavaScript u pregledniku i osvježi stranicu.
      </p>
    </noscript>
    <!-- The boot fallback (story 1.1d), and the one Croatian literal outside
         hr.json. It cannot come from a key: the failures it covers are the
         translation layer refusing to start and the bundle never loading at
         all, so a key would resolve to nothing in the first case and no
         JavaScript would run in the second. It is static markup inside #root,
         which `createRoot().render()` clears on a successful mount, so it
         needs no removal step and no eslint exception. -->
    <div id="root">
      <p id="boot-fallback">Shift se nije pokrenuo. Osvježi stranicu.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
