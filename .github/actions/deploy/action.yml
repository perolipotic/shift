name: Deploy one environment
description: >-
  Story 20.6 (DEPLOY.md §8.1): one self-hosted environment, a Coolify project
  on our own server. Builds, checks and probes both images on the runner,
  joins the tailnet as an ephemeral tag:ci node, applies the migrations over
  it (a production migration only after a recorded backup), pushes the
  probed images to GHCR, points the environment's channel tags at their
  digests, asks Coolify to deploy them with a deploy-only token, and proves
  what is live. Runs after actions/checkout and ./setup, and after the
  calling job has checked every input (scripts/ci/require-config.mjs), so no
  remote command runs on a partial or malformed configuration. No runtime
  secret of the stack passes through here: they live in Coolify (AD-17 as
  amended).

inputs:
  environment:
    description: The GitHub Environment, and the channel tag Coolify pulls (staging or production).
    required: true
  app-origins:
    description: >-
      Comma-separated bare https origins the app is served from; the first is
      the one the deploy checks and the smoke targets.
    required: true
  supabase-api-url:
    description: The stack's public API origin (Kong), https://api.<domain>. Public.
    required: true
  supabase-publishable-key:
    description: The stack's sb_publishable_ key, inlined into the bundle. Public.
    required: true
  vapid-public-key:
    description: The stack's Web Push public key, inlined into the bundle. Public.
    required: true
  db-host:
    description: Postgres's tailnet name (published by tailscale serve on the host).
    required: true
  db-port:
    required: true
  db-password:
    description: The stack's Postgres password, for db push and migration list only.
    required: true
  coolify-api-url:
    description: Coolify's API origin on the tailnet.
    required: true
  coolify-api-token:
    description: A Coolify API token with the deploy ability only.
    required: true
  coolify-web-uuid:
    description: The shift-web Docker-image application's uuid in Coolify.
    required: true
  coolify-functions-uuid:
    description: The Supabase stack's (service's) uuid in Coolify.
    required: true
  ts-oauth-client-id:
    required: true
  ts-oauth-secret:
    required: true
  registry-token:
    description: The job's GITHUB_TOKEN, with packages write (GHCR).
    required: true
  functions-image:
    description: >-
      A shift-functions reference by digest to deploy as it is (production
      deploys the one staging probed and deployed). Empty: build it, or reuse
      the probed build of the same sources.
    required: false
    default: ''
  pre-migration-backup-at:
    description: Production only, when migrations are pending - the UTC time of the backup taken for them.
    required: false
    default: ''

outputs:
  app-origin:
    description: The first app origin, which the smoke targets and the Environment URL shows.
    value: ${{ steps.origin.outputs.app-origin }}
  origins:
    description: The normalized comma-separated origin list.
    value: ${{ steps.origin.outputs.origins }}
  supabase-url:
    description: The stack's public API origin.
    value: ${{ steps.origin.outputs.supabase-url }}
  functions-image:
    description: The shift-functions reference by digest now running in this environment.
    value: ${{ steps.functions-image.outputs.ref }}
  web-image:
    description: The shift-web reference by digest now running in this environment.
    value: ${{ steps.web-push.outputs.ref }}

runs:
  using: composite
  steps:
    # The one parse of APP_ORIGINS (scripts/ci/origins.mjs, https only), and
    # the two GHCR repositories under the repository's owner (lowercase, as
    # the registry requires).
    - name: Resolve origins and repositories
      id: origin
      shell: bash
      env:
        APP_ORIGINS: ${{ inputs.app-origins }}
        SUPABASE_API_URL: ${{ inputs.supabase-api-url }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "$ENVIRONMENT" in staging|production) ;; *) echo "::error::unknown environment $ENVIRONMENT"; exit 1 ;; esac
        node scripts/ci/origins.mjs "$APP_ORIGINS"
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        {
          echo "supabase-url=$SUPABASE_API_URL"
          echo "functions-repository=ghcr.io/$owner/shift-functions"
          echo "web-repository=ghcr.io/$owner/shift-web"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------- images, on the runner
    # Everything that can refuse a release runs before the tailnet and the
    # migration, so no migration is applied for images that would be refused.

    # Vite inlines VITE_* at build time, so each environment builds its own
    # bundle (and its own CSP, which names this API origin).
    - name: Build apps/web for ${{ inputs.environment }}
      shell: bash
      env:
        VITE_SUPABASE_URL: ${{ inputs.supabase-api-url }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        VITE_VAPID_PUBLIC_KEY: ${{ inputs.vapid-public-key }}
      run: pnpm --filter "@shift/web..." build

    # AD-17 on the bundle about to ship: no sb_secret_ key, no JWT whose role
    # is not anon, no Resend key, and not the private half of this
    # environment's VAPID public key (scripts/ci/check-bundle.mjs).
    - name: The bundle carries no secret
      shell: bash
      env:
        VAPID_PUBLIC_KEY: ${{ inputs.vapid-public-key }}
      run: node scripts/ci/check-bundle.mjs apps/web/dist "$VAPID_PUBLIC_KEY"

    # The build's source maps are `hidden` (vite.config.ts); none is published
    # (and deploy/web/Dockerfile fails if one is left).
    - name: No source map is published
      shell: bash
      run: find apps/web/dist -name '*.map' -type f -delete

    - name: Build shift-web and probe it offline
      shell: bash
      run: |
        docker build --pull -f deploy/web/Dockerfile -t "shift-web:deploy-$GITHUB_SHA" .
        bash scripts/ci/probe-web-image.sh "shift-web:deploy-$GITHUB_SHA" apps/web/dist

    # GHCR, with the job's own GITHUB_TOKEN (packages: write on the deploy
    # jobs only), on stdin. Logged out at the end however the job ends.
    - name: Log in to GHCR
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    # The functions image is code only, the same for every environment.
    # Staging builds and probes it, unless the registry already holds the
    # probed build of these exact sources (`:src-<hash>`), which is reused so
    # an SPA-only release never restarts the stack. Production deploys the
    # digest staging deployed (`functions-image`), never a rebuild.
    - name: shift-functions (build and probe, or reuse)
      id: functions-image
      shell: bash
      env:
        GIVEN: ${{ inputs.functions-image }}
        REPOSITORY: ${{ steps.origin.outputs.functions-repository }}
      run: |
        ref="$(bash scripts/ci/deploy-images.sh functions-image)"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    # A commit tag only: nothing pulls `<environment>-<sha>`, so pushing it
    # changes nothing that runs. The digest it prints is the rollback handle
    # (DEPLOY.md §8.7); a re-run of the job may push the tag again.
    - name: Push shift-web (probed, not yet deployed)
      id: web-push
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY: ${{ steps.origin.outputs.web-repository }}
      run: |
        ref="$(bash scripts/ci/registry.sh push "shift-web:deploy-$GITHUB_SHA" "$REPOSITORY" "$ENVIRONMENT-$GITHUB_SHA")"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    # --------------------------------------------------------------- tailnet
    # An ephemeral node tagged tag:ci, from the OAuth client (H-9). The
    # tailnet's ACL lets tag:ci reach the stacks' Postgres ports and the
    # Coolify API only. The node logs out when the job ends.
    - name: Join the tailnet (ephemeral, tag:ci)
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci
        use-cache: 'false'

    # ------------------------------------------------------------ migrations
    # The URL carries no password: the CLI reads it from PGPASSWORD, so it is
    # never an argument. Host and port were shape-checked by require-config.
    # Also the preflight of everything a later step needs from the runner and
    # the database (psql, a connection), so nothing is found missing after the
    # migration has been applied.
    - name: supabase migration list (before)
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.db-password }}
        PGCONNECT_TIMEOUT: '10'
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
      run: |
        command -v psql > /dev/null || { echo "::error::psql is not on the runner"; exit 1; }
        psql "postgresql://postgres@$DB_HOST:$DB_PORT/postgres" -XAtc 'select 1' > /dev/null
        pnpm exec supabase migration list --db-url "postgresql://postgres@$DB_HOST:$DB_PORT/postgres" \
          --output-format json > "$RUNNER_TEMP/migrations-before.json"

    # H-12: a production migration runs only after a backup recorded within
    # the last 24 hours (scripts/ci/backup-gate.mjs). Story 20.7 replaces the
    # operator's manual backup with an automated one at this step.
    - name: A backup precedes a production migration
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        PRE_MIGRATION_BACKUP_AT: ${{ inputs.pre-migration-backup-at }}
      run: node scripts/ci/backup-gate.mjs --environment "$ENVIRONMENT" "$RUNNER_TEMP/migrations-before.json"

    # FIRST, before any image: the access token hook's function exists before
    # GoTrue is (re)started with the hook (§9.4), and every column exists
    # before the SPA that selects it (§5.2c). Migrations only, never the seed.
    - name: supabase db push
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.db-password }}
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
      run: pnpm exec supabase db push --db-url "postgresql://postgres@$DB_HOST:$DB_PORT/postgres" --yes

    - name: supabase migration list (local and remote must agree)
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.db-password }}
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
      run: |
        pnpm exec supabase migration list --db-url "postgresql://postgres@$DB_HOST:$DB_PORT/postgres" \
          --output-format json > "$RUNNER_TEMP/migrations.json"
        node scripts/ci/check-migrations.mjs "$RUNNER_TEMP/migrations.json"

    # ------------------------------------------------------------- functions
    # Coolify's stack pulls `shift-functions:<environment>`. A deploy-only
    # token cannot change that reference, so the tag is moved to the probed
    # digest and the stack is restarted with its images pulled again: the
    # whole stack, Postgres included (about a minute; DEPLOY.md §8.1). The
    # restart happens only when the digest differs from the last one verified
    # here (`<environment>-live`). The restart is shown by Postgres having
    # started after the request, then by the notify probe; which digest the
    # container runs is not visible from here (20.5 checks it on the host).
    # The logic is scripts/ci/deploy-images.sh, tested with stand-ins.
    - name: Deploy shift-functions
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REF: ${{ steps.functions-image.outputs.ref }}
        COOLIFY_API_URL: ${{ inputs.coolify-api-url }}
        COOLIFY_API_TOKEN: ${{ inputs.coolify-api-token }}
        STACK_UUID: ${{ inputs.coolify-functions-uuid }}
        PGPASSWORD: ${{ inputs.db-password }}
        PGCONNECT_TIMEOUT: '10'
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
      run: DB_URL="postgresql://postgres@$DB_HOST:$DB_PORT/postgres" bash scripts/ci/deploy-images.sh deploy-functions

    # DEPLOY.md §6: notify is live behind Kong and the router, and refuses a
    # caller without the invoke secret before it claims anything. Sends no
    # token, so it can never trigger a send. Retried while the stack starts.
    - name: notify refuses a caller without the invoke secret
      shell: bash
      env:
        SUPABASE_URL: ${{ steps.origin.outputs.supabase-url }}
      run: |
        status=''
        for _ in $(seq 1 30); do
          body="$(curl -sS -m 15 -o - -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/notify" || true)"
          status="${body##*$'\n'}"
          if [ "$status" = "401" ] && grep -q '"code":"INVOKE_SECRET_REFUSED"' <<< "${body%$'\n'*}"; then
            echo "notify answers 401 INVOKE_SECRET_REFUSED"
            exit 0
          fi
          sleep 10
        done
        echo "::error title=notify probe::expected 401 INVOKE_SECRET_REFUSED, last got ${status:-no answer}"
        exit 1

    - name: Record the verified functions digest
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REF: ${{ steps.functions-image.outputs.ref }}
      run: bash scripts/ci/registry.sh point "$REF" "$ENVIRONMENT-live"

    # ------------------------------------------------------------------- web
    # After the migration and the functions (§5.2c, and from 0045 the outbox
    # holds push rows only this notify sends). Coolify's Docker-image
    # application pulls `shift-web:<environment>`, now the probed digest; the
    # deploy is done when the origin serves this build's index.html with this
    # build's headers.
    - name: Deploy shift-web
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REF: ${{ steps.web-push.outputs.ref }}
        COOLIFY_API_URL: ${{ inputs.coolify-api-url }}
        COOLIFY_API_TOKEN: ${{ inputs.coolify-api-token }}
        WEB_UUID: ${{ inputs.coolify-web-uuid }}
        APP_ORIGIN: ${{ steps.origin.outputs.app-origin }}
        DIST: apps/web/dist
      run: bash scripts/ci/deploy-images.sh deploy-web

    - name: Log out of GHCR
      if: always()
      shell: bash
      run: docker logout ghcr.io || true

    # Also on failure: the references pushed so far are what a rollback or a
    # retry needs.
    - name: Summary
      if: always()
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        APP_ORIGIN: ${{ steps.origin.outputs.app-origin }}
        SUPABASE_URL: ${{ steps.origin.outputs.supabase-url }}
        FUNCTIONS_REF: ${{ steps.functions-image.outputs.ref }}
        WEB_REF: ${{ steps.web-push.outputs.ref }}
      run: |
        {
          echo "### Deploy of ${ENVIRONMENT} (see the job's result)"
          echo ""
          echo "- app: ${APP_ORIGIN}"
          echo "- API: ${SUPABASE_URL}"
          echo "- commit: ${GITHUB_SHA}"
          echo "- shift-web: \`${WEB_REF:-not pushed}\`"
          echo "- shift-functions: \`${FUNCTIONS_REF:-not resolved}\`"
          echo ""
          echo "To roll back to this release later: DEPLOY.md §8.7, with the two digests above."
        } >> "$GITHUB_STEP_SUMMARY"
