name: Setup
description: >-
  Node from .nvmrc, pnpm from package.json "packageManager", a cached pnpm
  store, and a frozen-lockfile install. Every job in pipeline.yml runs this
  after actions/checkout.

runs:
  using: composite
  steps:
    # pnpm first: setup-node's `cache: pnpm` asks pnpm where its store is. No
    # `version` input, so the action reads `packageManager` and the two can
    # never disagree.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
