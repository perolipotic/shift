# The one pipeline (DEPLOY.md, "CI/CD").
#
#   Stage 1  quality   gitleaks over the full history, ESLint
#   Stage 2  build     typecheck, build, upload apps/web/dist
#            test      local Supabase, build, `pnpm test`, zero skipped
#            changes   pull requests only: is anything but docs changed?
#            e2e       local Supabase, the Playwright E2E suite in four shards,
#                      then (shard 1) the remote smoke against the same servers;
#                      skipped on a pull request that changes docs alone
#            e2e-report  merges the four shards' reports into one HTML report
#            functions-image  builds the `shift-functions` image (story 20.2),
#                        never pushed, and probes it with no route to the internet
#            runtime-parity  the domain probe under Node and under the pinned
#                        edge-runtime, byte for byte (story 16.2)
#            web-image   builds the `shift-web` image (story 20.3) from the build
#                        job's apps/web/dist, never pushed, and probes it with
#                        no network
#            ci-passed   the one required check on main: quality, build, test,
#                        functions-image, runtime-parity, web-image and e2e
#                        passed (e2e may be skipped on a docs-only PR)
#   main only, and only when vars.DEPLOY_ENABLED == 'true':
#            deploy-staging → smoke-staging → deploy-production (approval) → smoke-production
#            Story 20.6: each deploy job targets a self-hosted stack run by
#            Coolify (.github/actions/deploy): it builds and probes the images,
#            joins the tailnet as an ephemeral tag:ci node, migrates over it,
#            pushes the probed images to GHCR with its own GITHUB_TOKEN (the
#            only jobs with packages: write) and has Coolify deploy them
#            notify    on any failure on main
#
# Pull requests stop after `ci-passed` (the check named "CI passed"). Every third-party action is pinned
# to a full commit SHA; the version is in the comment beside it.

name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests only: a newer push to a PR cancels that PR's run in progress.
# Pushes to main get NO workflow-level group, deliberately. GitHub keeps at most
# one running and one PENDING run per concurrency group and silently cancels an
# older pending one, so a main-wide group would let a run parked at the
# production approval hold back — and then drop — the CI of every push behind
# it. Instead every push to main runs quality/build/test/e2e at once, and only
# the deploy jobs queue, each in its own job-level group below (same
# one-pending rule: while a deploy runs, only the NEWEST waiting deploy is
# kept, which is the one worth shipping).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pipeline-pr-{0}', github.ref) || format('pipeline-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Supabase CLI: no prompts, no telemetry, no update nag.
  SUPABASE_TELEMETRY_DISABLED: '1'
  # Local stack services no CI job uses, left out of `supabase start`: Studio
  # and its postgres-meta, the analytics pair (logflare, vector), Realtime (the
  # app opens no channel) and the mail catcher (no account has a real address).
  # About 4 GB of images every runner no longer pulls.
  SUPABASE_UNUSED_SERVICES: studio,postgres-meta,logflare,vector,realtime,mailpit,imgproxy

jobs:
  # ----------------------------------------------------------------- Stage 1
  quality:
    name: Quality (gitleaks, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, not only the tip
          persist-credentials: false

      # The image is pinned by digest as well as by tag. `.gitleaks.toml`
      # extends the default rules and allowlists only known fake values. Run as
      # the runner's own user, so the mounted checkout is owned by the scanning
      # user and git's safe.directory check never applies. The expected commit
      # count is printed first; gitleaks logs "N commits scanned" at the end,
      # and the two should agree.
      - name: Gitleaks (full history)
        run: |
          echo "commits in history: $(git rev-list --all --count)"
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-level info

      # Story 20.4's host scripts are never run in CI (they change a host's
      # firewall and sshd); ShellCheck is their static gate, and
      # test/host-hardening.test.ts pins what they do. ShellCheck ships with
      # the ubuntu-24.04 runner image.
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x deploy/host/*.sh deploy/web/render-headers.sh scripts/ci/registry.sh scripts/ci/deploy-images.sh scripts/ci/runtime-parity.sh

      - uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm lint

  # ----------------------------------------------------------------- Stage 2
  build:
    name: Build (typecheck, build)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Built with no environment's VITE_* values, so it proves the build works
      # and nothing more: every deploy job rebuilds with its own (spec, Design
      # Notes). Never deployed.
      - name: Upload apps/web/dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Deploys are not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
        run: |
          echo "::notice title=Deploys skipped::vars.DEPLOY_ENABLED is not 'true', so deploy-staging, smoke-staging, deploy-production and smoke-production are skipped."
          {
            echo "### Deploys skipped"
            echo ""
            echo "The repository variable \`DEPLOY_ENABLED\` is not \`true\`, so this run stops after \`test\` and \`e2e\`."
            echo "To turn deploys on, configure what DEPLOY.md → *CI/CD* lists, then set \`DEPLOY_ENABLED=true\`:"
            echo ""
            echo "- environments \`staging\` and \`production\`, both restricted to the \`main\` branch, production with a required reviewer"
            echo "- on EACH environment, secrets \`SUPABASE_DB_PASSWORD\`, \`COOLIFY_API_TOKEN\`, \`TS_OAUTH_CLIENT_ID\`, \`TS_OAUTH_SECRET\` and variables \`APP_ORIGINS\`, \`SUPABASE_API_URL\`, \`SUPABASE_PUBLISHABLE_KEY\`, \`VAPID_PUBLIC_KEY\`, \`DB_HOST\`, \`DB_PORT\`, \`COOLIFY_API_URL\`, \`COOLIFY_WEB_UUID\`, \`COOLIFY_FUNCTIONS_UUID\`"
            echo "- each environment's stack stood up in Coolify (story 20.5), pulling \`shift-web:<environment>\` and \`shift-functions:<environment>\` from GHCR with a \`read:packages\`-only credential on the server"
            echo "- the tailnet ACL: \`tag:ci\` reaches the Postgres ports and the Coolify API only; the OAuth client creates \`tag:ci\` keys only"
            echo "- before a production release with migrations: a backup in Coolify, then the production variable \`PRE_MIGRATION_BACKUP_AT\` (DEPLOY.md §8.2)"
            echo "- no deploy credential as a repository secret; no runtime secret in GitHub at all (they live in Coolify)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Story 20.2: the self-hosted stack's functions image, BUILT ONLY. Nothing is
  # pushed and no registry credential exists here (pushing is story 20.6's
  # deploy). The probe runs it on an `--internal` network beside a stand-in
  # GoTrue: both functions' workers must start from the bundles the build made
  # (admin-auth's handler answers `PAYLOAD_INVALID`), and with GoTrue gone a
  # token sent to a `verify_jwt` function must be refused, never passed.
  functions-image:
    name: Functions image (build, offline probe)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build shift-functions (not pushed)
        run: docker build --pull -f deploy/functions/Dockerfile -t "shift-functions:ci-$GITHUB_SHA" .

      - name: Probe it offline
        run: bash scripts/ci/probe-functions-image.sh "shift-functions:ci-$GITHUB_SHA"

  # Story 16.2 (AD-7, AD-19): the domain package under the functions' own
  # runtime. The probe runs under Node over the built packages/domain/dist
  # (test/runtime-parity.test.ts, which writes its answer), then under the
  # pinned edge-runtime from the same dist through deploy/parity/deno.json's
  # import map, bundled and served with --network none; the two answers must
  # be byte-identical. The pin is the functions image's base, held equal by
  # test/runtime-parity.test.ts.
  runtime-parity:
    name: Runtime parity (Node and edge-runtime)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EDGE_RUNTIME_IMAGE: supabase/edge-runtime:v1.74.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build @shift/domain
        run: pnpm --filter @shift/domain build

      - name: The probe under Node
        run: SHIFT_PARITY_OUT="$RUNNER_TEMP/parity-node.json" pnpm exec vitest run test/runtime-parity.test.ts

      - name: The probe under edge-runtime, compared
        run: bash scripts/ci/runtime-parity.sh "$EDGE_RUNTIME_IMAGE" "$RUNNER_TEMP/parity-node.json"

  # Story 20.3: the SPA's image, BUILT ONLY, from the `build` job's dist (built
  # with no environment's VITE_*, so its CSP names no Supabase origin): this
  # proves the image, not a deploy. Building it per environment from that
  # environment's own build, and pushing it, is story 20.6's deploy job. No
  # registry credential exists here. The probe runs it with `--network none`
  # and a read-only root, and checks every response against the same
  # dist/_headers.
  web-image:
    name: Web image (build, offline probe)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download apps/web/dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist

      - name: Build shift-web (not pushed)
        run: docker build --pull -f deploy/web/Dockerfile -t "shift-web:ci-$GITHUB_SHA" .

      - name: Probe it offline
        run: bash scripts/ci/probe-web-image.sh "shift-web:ci-$GITHUB_SHA" apps/web/dist

  test:
    name: Test (Vitest, local Supabase)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The full stack: `test/rls-isolation.test.ts` needs the API and the
      # secret key from `supabase status`, not only Postgres. Migrations and
      # seed.sql are applied by start. A runner of its own, so the E2E job's
      # organizations never meet this job's organization counts.
      - name: Start local Supabase
        run: bash scripts/ci/start-supabase.sh "$SUPABASE_UNUSED_SERVICES"

      # The build-gated root tests read apps/web/dist and fail on a stale one.
      # Story 20.3: a placeholder origin in `.env.production.local` (gitignored;
      # read by `vite build` and by `static-hosting.test.ts`'s `loadEnv`, never
      # by Vitest's `test` mode), so the built CSP's origin wiring is asserted.
      - name: Build
        run: |
          printf 'VITE_SUPABASE_URL=https://api.example.test\n' > apps/web/.env.production.local
          pnpm build

      # Arguments to `pnpm test` reach its last command, the root `vitest run`.
      - name: pnpm test
        run: pnpm test --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-root.json"

      - name: No root test was skipped
        run: node scripts/ci/assert-no-skipped.mjs "$RUNNER_TEMP/vitest-root.json"

  # Pull requests only: does the change reach anything the E2E suite runs?
  # A pull request that changes only planning docs, Markdown or agent
  # configuration skips `e2e` (and so `e2e-report`). Every push to main runs it,
  # because the deploy jobs need it.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit
          persist-credentials: false

      - name: Docs-only?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$changed"
          # Docs: planning and BMad output, agent configuration, Markdown.
          rest="$(printf '%s\n' "$changed" | grep -vE '^(_bmad-output/|_bmad/|\.claude/|docs/)|\.md$' || true)"
          if [ -z "$rest" ]; then
            echo "::notice title=E2E skipped::this pull request changes docs only"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  # Four shards, each on a runner with a stack of its own: Playwright splits the
  # suite four ways (`--shard`), so the wall time is about a quarter of one run
  # plus the setup every shard repeats. Each shard writes a blob report, and
  # `e2e-report` merges them.
  #
  # TIMEOUT (retro 12 A7): measured over the last 12 `main` runs, shards take
  # 6–12 min, with outliers at 16 min (a slow Supabase image pull) and one
  # cancelled at 20. 30 min leaves headroom for a slow pull; a fifth shard is
  # warranted only if shards routinely pass 15 min.
  e2e:
    name: E2E (Playwright, shard ${{ matrix.shard }}/4)
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failing shard still lets the others report
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Without the edge runtime: the function has to be served with
      # supabase/functions/.env, which cannot exist until the stack's keys do.
      # `supabase functions serve` below reads the file written after start.
      - name: Start local Supabase (edge runtime left to functions serve)
        run: bash scripts/ci/start-supabase.sh "edge-runtime,$SUPABASE_UNUSED_SERVICES"

      - name: Write apps/web/.env.local and supabase/functions/.env
        run: node scripts/ci/write-local-env.mjs

      - uses: ./.github/actions/playwright

      # Started here rather than by Playwright's webServer, so the same two
      # servers are up for the E2E suite (whose webServer entries reuse them)
      # and for the smoke after it. Same host and port as playwright.config.ts:
      # the function's CORS admits only http://127.0.0.1:5173.
      - name: Serve admin-auth and the app
        id: serve
        run: |
          nohup bash scripts/ci/serve-admin-auth.sh > "$RUNNER_TEMP/functions.log" 2>&1 &
          nohup pnpm --filter @shift/web exec vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          # Up means any answer below 404: the function answers 401 without a
          # JWT once served; before that the gateway answers 5xx.
          wait_for() {
            for _ in $(seq 1 120); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)"
              case "$code" in 2??|3??|40[0-3]) echo "$2 is up (HTTP $code)"; return 0 ;; esac
              sleep 1
            done
            echo "::error title=$2 did not start::no answer from $1 within 120 s"
            return 1
          }
          wait_for http://127.0.0.1:5173/ vite
          wait_for http://127.0.0.1:54321/functions/v1/admin-auth admin-auth

      - name: pnpm test:e2e (shard ${{ matrix.shard }}/4)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4 --reporter=github,blob

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 3

      # The smoke specs, exercised on every PR against the local stack: every
      # anonymous check, plus sign-in with a seeded member. Never signs out.
      # Once per run, on the first shard.
      - name: pnpm test:smoke (local stack)
        if: ${{ !cancelled() && matrix.shard == 1 && steps.serve.outcome == 'success' }}
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5173
          SMOKE_ORG: dvd-kastel-novi
          SMOKE_USERNAME: ana.kovac
          SMOKE_PASSWORD: local-fixture-password
        run: pnpm test:smoke

      - name: Server logs
        if: failure()
        run: |
          echo "::group::vite"; cat "$RUNNER_TEMP/vite.log" || true; echo "::endgroup::"
          echo "::group::functions serve"; cat "$RUNNER_TEMP/functions.log" || true; echo "::endgroup::"

      # Traces and screenshots of this shard's failures; the merged HTML report
      # is `e2e-report`'s.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report-smoke/
            test-results-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the servers
        if: always()
        run: |
          pkill -f 'vite --host 127.0.0.1 --port 5173' || true
          pkill -f 'serve-admin-auth.sh' || true
          pkill -f 'supabase functions serve admin-auth' || true

  # One HTML report for the whole suite, merged from the shards' blob reports,
  # whether the shards passed or not.
  e2e-report:
    name: E2E report
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14

  # The one check branch protection on `main` requires (retro 10 A12: a red
  # main blocks merges). Protection matches the job's NAME, "CI passed": rename
  # it and update the rule in the same change, or every PR waits forever.
  #
  # Requiring the E2E shards directly cannot work: on a docs-only pull request
  # the skipped matrix job reports under its unexpanded name, `E2E (Playwright,
  # shard ${{ matrix.shard }}/4)`, so a required "shard 1/4" never reports.
  #
  # This job fails when any job in `needs` failed, was cancelled or was skipped,
  # except `e2e` skipped because `changes` said docs only. A new job that must
  # be green before a merge goes into `needs`; the check reads `needs` whole,
  # so nothing else changes. `e2e-report` is left out on purpose: a broken
  # report merge is not a reason to refuse a merge.
  #
  # `always()`, not `!cancelled()`: a skipped required check counts as passing,
  # so on a cancelled run the gate must run and fail, not be skipped.
  #
  # With "require branches to be up to date", a PR merges only after its run
  # included the latest main: a deterministic failure on main fails the PR too.
  # A flake on main does not, and a docs-only PR skips E2E even then.
  ci-passed:
    name: CI passed
    needs: [quality, build, test, functions-image, runtime-parity, web-image, changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          E2E_WANTED: ${{ needs.changes.outputs.e2e }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS"
          # An empty E2E_WANTED (changes did not say) is not "docs only": e2e must pass.
          bad="$(jq -r --arg wanted "$E2E_WANTED" '
            to_entries
            | map(select(.value.result != "success"
                         and ((.key == "e2e" and .value.result == "skipped" and $wanted == "false") | not)))
            | map("\(.key)=\(.value.result)") | join(", ")' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error title=CI did not pass::${bad}"
            exit 1
          fi
          if [ "$E2E_WANTED" = "false" ]; then echo "e2e skipped: docs only"; fi

  # ------------------------------------------------------- staging (main only)
  deploy-staging:
    name: Deploy staging
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The only jobs that may push to GHCR (packages: write), and only here:
    # a push to main, deploys enabled, the staging Environment's branch rule.
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-origin }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      app-origin: ${{ steps.deploy.outputs.app-origin }}
      supabase-url: ${{ steps.deploy.outputs.supabase-url }}
      functions-image: ${{ steps.deploy.outputs.functions-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          SUPABASE_API_URL: ${{ vars.SUPABASE_API_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
          COOLIFY_FUNCTIONS_UUID: ${{ vars.COOLIFY_FUNCTIONS_UUID }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: >-
          node scripts/ci/require-config.mjs --environment staging
          var:APP_ORIGINS var:SUPABASE_API_URL:https-origin var:SUPABASE_PUBLISHABLE_KEY:publishable
          var:VAPID_PUBLIC_KEY:vapid-public var:DB_HOST:tailnet-host var:DB_PORT:port secret:SUPABASE_DB_PASSWORD
          var:COOLIFY_API_URL:tailnet-url secret:COOLIFY_API_TOKEN:coolify-token
          var:COOLIFY_WEB_UUID:coolify-uuid var:COOLIFY_FUNCTIONS_UUID:coolify-uuid
          secret:TS_OAUTH_CLIENT_ID secret:TS_OAUTH_SECRET:ts-oauth-secret

      - uses: ./.github/actions/setup

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: staging
          app-origins: ${{ vars.APP_ORIGINS }}
          supabase-api-url: ${{ vars.SUPABASE_API_URL }}
          supabase-publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          vapid-public-key: ${{ vars.VAPID_PUBLIC_KEY }}
          db-host: ${{ vars.DB_HOST }}
          db-port: ${{ vars.DB_PORT }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          coolify-api-url: ${{ vars.COOLIFY_API_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          coolify-web-uuid: ${{ vars.COOLIFY_WEB_UUID }}
          coolify-functions-uuid: ${{ vars.COOLIFY_FUNCTIONS_UUID }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          registry-token: ${{ github.token }}

  # The SPA, the Supabase environment it was built with, signup refused,
  # admin-auth CORS, and — with the smoke account configured — a sign-in that
  # never signs out. Writes nothing, except that an OPEN signup means the probe
  # just created an account, which its failure message names (DEPLOY.md §8.3).
  # The `staging` environment for the smoke account's secret; staging has no
  # required reviewer, so this never waits.
  smoke-staging:
    name: Smoke staging
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/playwright

      - name: pnpm test:smoke
        env:
          SMOKE_BASE_URL: ${{ needs.deploy-staging.outputs.app-origin }}
          SMOKE_SUPABASE_URL: ${{ needs.deploy-staging.outputs.supabase-url }}
          SMOKE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SMOKE_ORG: ${{ vars.SMOKE_ORG }}
          SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: pnpm test:smoke

      - name: Upload the smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-staging-report
          path: |
            playwright-report-smoke/
            test-results-smoke/
          retention-days: 14

  # ---------------------------------------------------- production (main only)
  # Waits for a required reviewer on the `production` environment (DEPLOY.md,
  # "CI/CD"). Starts only if staging deployed AND its smoke passed.
  deploy-production:
    name: Deploy production
    # deploy-staging is already implied by smoke-staging; named so its
    # functions digest can be read.
    needs: [deploy-staging, smoke-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-origin }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      app-origin: ${{ steps.deploy.outputs.app-origin }}
      supabase-url: ${{ steps.deploy.outputs.supabase-url }}
      # Public by design (it is inlined into every bundle), and handed on so
      # the anonymous smoke needs no environment — and so no second approval.
      publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          SUPABASE_API_URL: ${{ vars.SUPABASE_API_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
          COOLIFY_FUNCTIONS_UUID: ${{ vars.COOLIFY_FUNCTIONS_UUID }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: >-
          node scripts/ci/require-config.mjs --environment production
          var:APP_ORIGINS var:SUPABASE_API_URL:https-origin var:SUPABASE_PUBLISHABLE_KEY:publishable
          var:VAPID_PUBLIC_KEY:vapid-public var:DB_HOST:tailnet-host var:DB_PORT:port secret:SUPABASE_DB_PASSWORD
          var:COOLIFY_API_URL:tailnet-url secret:COOLIFY_API_TOKEN:coolify-token
          var:COOLIFY_WEB_UUID:coolify-uuid var:COOLIFY_FUNCTIONS_UUID:coolify-uuid
          secret:TS_OAUTH_CLIENT_ID secret:TS_OAUTH_SECRET:ts-oauth-secret

      - uses: ./.github/actions/setup

      # The functions image is not rebuilt: production deploys the digest
      # staging probed, deployed and smoke-tested in this same run.
      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: production
          app-origins: ${{ vars.APP_ORIGINS }}
          supabase-api-url: ${{ vars.SUPABASE_API_URL }}
          supabase-publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          vapid-public-key: ${{ vars.VAPID_PUBLIC_KEY }}
          db-host: ${{ vars.DB_HOST }}
          db-port: ${{ vars.DB_PORT }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          coolify-api-url: ${{ vars.COOLIFY_API_URL }}
          coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
          coolify-web-uuid: ${{ vars.COOLIFY_WEB_UUID }}
          coolify-functions-uuid: ${{ vars.COOLIFY_FUNCTIONS_UUID }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          registry-token: ${{ github.token }}
          functions-image: ${{ needs.deploy-staging.outputs.functions-image }}
          pre-migration-backup-at: ${{ vars.PRE_MIGRATION_BACKUP_AT }}

  # Anonymous: production has no smoke account, so nothing here signs in.
  smoke-production:
    name: Smoke production
    needs: deploy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/playwright

      - name: pnpm test:smoke
        env:
          SMOKE_BASE_URL: ${{ needs.deploy-production.outputs.app-origin }}
          SMOKE_SUPABASE_URL: ${{ needs.deploy-production.outputs.supabase-url }}
          SMOKE_PUBLISHABLE_KEY: ${{ needs.deploy-production.outputs.publishable-key }}
        run: pnpm test:smoke

      - name: Upload the smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-production-report
          path: |
            playwright-report-smoke/
            test-results-smoke/
          retention-days: 14

  # ------------------------------------------------------------------ notify
  notify:
    name: Notify
    needs: [quality, build, test, functions-image, runtime-parity, web-image, e2e, deploy-staging, smoke-staging, deploy-production, smoke-production]
    if: (failure() || cancelled()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Summary
        run: |
          list() { jq -r --arg result "$1" 'to_entries | map(select(.value.result == $result) | .key) | join(", ")' <<< "$NEEDS"; }
          failed="$(list failure)"
          cancelled="$(list cancelled)"
          outcome="failed: ${failed:-none}; cancelled: ${cancelled:-none}"
          if [ -z "$failed" ] && [ -z "$cancelled" ]; then outcome="unknown"; fi
          echo "outcome=${outcome}" >> "$GITHUB_ENV"
          echo "::error title=Pipeline did not finish on main::${outcome}"
          echo "**Pipeline did not finish on \`main\`** at \`${GITHUB_SHA::7}\` — ${outcome}. [Run](${RUN_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          jq -n --arg text ":x: shift pipeline did not finish on main at ${GITHUB_SHA::7} (${outcome}): ${RUN_URL}" '{text: $text}' \
            | curl -fsS -X POST -H 'content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
