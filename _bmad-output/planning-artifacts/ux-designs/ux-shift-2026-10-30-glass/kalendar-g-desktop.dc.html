<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const WD = ['pon', 'uto', 'sri', 'čet', 'pet', 'sub', 'ned'];
    const marks = { '30-2': 'cf', '31-1': 'cf', '27-1': 'ov' };
    const T = ['A', 'B', 'C', 'D'];
    const week = [26, 27, 28, 29, 30, 31, 32].map((d, j) => {
      const team = (k) => [0, 1, 2, 3].find((x) => (d + x) % 4 === k);
      const shifts = [0, 1].map((k) => {
        const i = team(k);
        const m = marks[d + '-' + i] || '';
        return {
          cls: (k === 0 ? 'dan' : 'noc') + (m === 'cf' ? ' cf' : m === 'ov' ? ' ov' : ''),
          type: k === 0 ? 'Dan' : 'Noć', team: 'Smjena ' + T[i], time: k === 0 ? '07:00–19:00' : '19:00–07:00',
          cf: m === 'cf', ov: m === 'ov',
        };
      });
      const off = [team(2), team(3)].map((i) => T[i]).sort().join(', ');
      return { n: d > 31 ? 1 : d, wd: WD[j], cls: d === 30 ? 'today' : '', shifts, off };
    });
    const mini = [];
    [28, 29, 30].forEach((n) => mini.push({ n, cls: 'out' }));
    for (let d = 1; d <= 31; d++) mini.push({ n: d, cls: d === 30 ? 'td' : (d >= 26 ? 'wk' : '') });
    mini.push({ n: 1, cls: 'wk' });
    return { week, mini };
  }
}
</script>
