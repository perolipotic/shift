# Supabase CLI configuration for local development.
#
# Migrations under ./migrations are forward-only git files, promoted
# local -> staging -> production and never edited after promotion (DEPLOY.md).
# ./seed.sql is local and test-only: it is never bundled, never a default and
# never branched on by application code.

project_id = "shift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Identity without email: accounts are created by an admin through the
# admin-auth function, or by the operator provisioning script for the very
# first one. There is no open signup anywhere in this system.
#
# Two different switches, and only this one closes that door.
# `[auth] enable_signup` becomes GOTRUE_DISABLE_SIGNUP, which refuses
# self-registration and nothing else. `[auth.email] enable_signup` below
# becomes GOTRUE_EXTERNAL_EMAIL_ENABLED, which turns the email/password
# provider off entirely — sign-in included. Setting that one false does not
# harden signup; it makes every admin-issued credential unusable, and a
# password grant answers 422 "Email logins are disabled".
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The email/password provider, not the signup door — see the note above. It is
# on because admin-issued credentials are the only way anyone signs in, and
# open signup stays refused by `[auth] enable_signup = false`.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# AD-10: `organization_id` rides in a JWT claim, and this hook is the only thing
# that puts it there. The function is created by
# `supabase/migrations/0003_access_control.sql`, and the ordering is not
# negotiable in either direction: the migration must be applied before the hook
# is enabled, or every sign-in fails on a missing function (DEPLOY.md §5.2b).
#
# `pg-functions://` names the database, the schema and the function. Enabling
# this locally needs a full `supabase stop && supabase start`: the setting
# becomes a GOTRUE_HOOK_* environment variable on the auth container, and an
# edit to this file does not reach a container that is already running.
#
# The reader in `test/supabase-scaffold.test.ts` walks `[section]` headers and
# `key = value` lines and silently ignores any section it was not asked about,
# so a new section here is unenforced until something asserts it. That file
# asserts both keys below, and additionally asserts the function's EXECUTE
# grants in the database, because a URI naming a function nobody may call is
# configuration that looks right and signs nothing.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "oneshot"

# AD-16: exactly one Edge Function exists. A second one amends AD-14.
[functions.admin-auth]
enabled = true
verify_jwt = true
