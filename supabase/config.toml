# Supabase CLI configuration for local development.
#
# Migrations under ./migrations are forward-only git files, promoted
# local -> staging -> production and never edited after promotion (DEPLOY.md).
# ./seed.sql is local and test-only: it is never bundled, never a default and
# never branched on by application code.

project_id = "shift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Story 7.8: the floor for the password a member sets on their first sign-in,
# the same number the set-password step refuses below locally
# (`apps/web/src/features/auth/services/set-password.ts`, `PASSWORD_MIN_LENGTH`).
minimum_password_length = 10
# The signup door (AD-21, story 19.1). This file carries LOCAL AND STAGING's
# values; production's closed door lives in
# `deploy/coolify/supabase/production.env.example` (AD-10 as amended). The
# compose reads `GOTRUE_DISABLE_SIGNUP=${SHIFT_DISABLE_SIGNUP:-true}`, so a
# stack is shut unless its environment opens it, and `staging.env.example`
# opens it with exactly this value (`test/supabase-scaffold.test.ts` pins all
# three). Signup is open on a stack only while all three switches are open:
# this one, `private.signup_settings.open` (0066; `seed.sql` opens it locally)
# and the SPA's `VITE_SIGNUP_ENABLED`. Accounts created by an admin
# (`admin-auth`) or by the operator script are username identities, confirmed
# at creation, and unaffected by any of it.
#
# Two different switches, and only this one is the door.
# `[auth] enable_signup` becomes GOTRUE_DISABLE_SIGNUP, which refuses
# self-registration and nothing else. `[auth.email] enable_signup` below
# becomes GOTRUE_EXTERNAL_EMAIL_ENABLED, which turns the email/password
# provider off entirely — sign-in included. Setting that one false does not
# harden signup; it makes every admin-issued credential unusable, and a
# password grant answers 422 "Email logins are disabled".
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# The email/password provider, not the signup door — see the note above. It is
# on because every credential, admin-issued or signed up, is an email/password
# one.
enable_signup = true
# AD-21: an address is verified before it can found an organization, so
# confirmations are on wherever the door can open. Every account the system
# creates itself is confirmed at creation (`admin-auth`'s `email_confirm`, the
# seed, the operator scripts), so no username sign-in waits for a mail. Locally
# the CLI's mail catcher receives the mail, with the CLI's default templates:
# the Croatian ones link to `/potvrda`, which 19.2 builds (deferred-work.md).
enable_confirmations = true
double_confirm_changes = true
# AD-22: a link's `token_hash` is the only thing `/auth/v1/verify` accepts, but
# the code a mail could carry is bounded too: an hour, and 10 characters.
otp_expiry = 3600
otp_length = 10

[auth.sms]
enable_signup = false
enable_confirmations = false

# LOCAL STACK ONLY. The E2E suite signs in from one address over and over
# (wrong passwords, retries, `--repeat-each`), and a 429 there reads as
# `auth.error.unavailable`, so a sign-in assertion would fail for the limit
# rather than for the app. Raised from the CLI's defaults (30 and 150 per five
# minutes): `sign_in_sign_ups` is the CLI's sign-in and sign-up limit, and
# GoTrue counts every `/token` call, the password grant included, against
# `token_refresh`. A deploy never sends this table: `scripts/ci/set-auth-urls.mjs`
# drops it from the runner's copy before `config push`, so a hosted project
# keeps the defaults (DEPLOY.md §8.6).
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000

# AD-10: `organization_id` rides in a JWT claim, and this hook is the only thing
# that puts it there. The function is created by
# `supabase/migrations/0003_access_control.sql`, and the ordering matters in one
# direction: the migration must be applied before the hook is enabled, or every
# sign-in fails on a missing function. The other order is harmless — tokens are
# minted with no claim for the window, and a claimless token reads zero rows
# rather than another tenant's, because the policies fail closed on the claim's
# absence by design (DEPLOY.md §5.2b).
#
# `pg-functions://` names the database, the schema and the function. Enabling
# this locally needs a full `supabase stop && supabase start`: the setting
# becomes a GOTRUE_HOOK_* environment variable on the auth container, and an
# edit to this file does not reach a container that is already running.
#
# The reader in `test/supabase-scaffold.test.ts` walks `[section]` headers and
# `key = value` lines and silently ignores any section it was not asked about,
# so a new section here is unenforced until something asserts it. That file
# asserts both keys below, and additionally asserts the function's EXECUTE
# grants in the migration source text, because a URI naming a function nobody
# may call is configuration that looks right and signs nothing. The database
# ACL those grants produce is asserted separately, in
# `test/provisioning.test.ts` — source text alone cannot see a grant that a
# later migration took away.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# AD-21: refuses every new account unless `private.signup_settings` is open,
# the address is an email identity's and the 24-hour ceiling holds, all with
# one `SIGNUP_REFUSED` (0066). Enabled everywhere (story 19.1, D2): the door is
# shut by `enable_signup` and the switch, never by this hook being off. The
# same order rule as the hook above: 0066 is applied before it is enabled.
# GoTrue does not run it for `POST /admin/users`, so `admin-auth` is unaffected.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created_hook"

[edge_runtime]
enabled = true
policy = "oneshot"

# AD-14 (amended by story 10.1): exactly two Edge Functions exist. A third one
# amends AD-14 again.
#
# `admin-auth` is the privileged auth boundary (AD-16): every caller is a
# signed-in session, so the gateway verifies the JWT before the handler runs.
[functions.admin-auth]
enabled = true
verify_jwt = true

# `notify` sends what `notification_outbox` holds (AD-18). Its only caller is
# the `notify` cron job, which carries the invoke secret from Vault as its
# bearer token. That is no JWT, so the gateway lets it through and the handler
# compares it in constant time; a missing or wrong one is a 401 before
# anything is claimed.
[functions.notify]
enabled = true
verify_jwt = false
