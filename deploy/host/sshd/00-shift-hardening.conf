# Story 20.4 (H-4): SSH by key only; root by key only (Coolify logs in as root
# with its own key).
#
# sshd keeps the FIRST value it reads for a keyword, and sshd_config's
# `Include /etc/ssh/sshd_config.d/*.conf` reads this directory in lexical
# order. Named 00-, this file is read before cloud-init's 50-cloud-init.conf
# and the cloud image's 60-cloudimg-settings.conf, so whatever they set for
# these keywords is ignored. `shift-host.sh apply sshd` checks the result with
# `sshd -T`, not by trusting this comment.
#
# Who may reach sshd at all (the tailnet and Coolify's bridge) is the
# firewall's job: shift-v4.rules and shift-v6.rules.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin prohibit-password
