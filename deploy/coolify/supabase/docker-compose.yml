              url: http://supabase-rest:3000/rpc/create_organization
              routes:
                - name: rest-v1-create-organization
                  strip_path: true
                  methods:
                    - POST
                    - OPTIONS
                  paths:
                    - /rest/v1/rpc/create_organization$
              plugins:
                - name: pre-function
                  config:
                    access:
                      - |
                        -- AD-22: Kong 2.8 matches a route on the normalized path, so a
                        -- doubled `/` or a percent-encoded letter reaches it too. Only
                        -- the path as the allow-list writes it passes; any other
                        -- spelling is Kong's own 404. A pre-function runs first of
                        -- all (before cors, key-auth and the limit), so a variant is
                        -- 404 with or without a key, and counts against no limit.
                        local allowed = { ["/rest/v1/rpc/create_organization"] = true }
                        if not allowed[kong.request.get_path()] then
                          return kong.response.exit(404, '{"message":"no Route matched with those values"}', { ["Content-Type"] = "application/json; charset=utf-8" })
                        end
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon
                - name: rate-limiting
                  config:
                    hour: $SHIFT_LIMIT_CREATE_ORGANIZATION_HOUR
                    limit_by: ip
                    policy: local
                    hide_client_headers: true

            ## Secure REST routes
            - name: rest-v1
              url: http://supabase-rest:3000/
              routes:
                - name: rest-v1-all
                  strip_path: true
                  paths:
                    - /rest/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon
                - name: post-function
                  config:
                    access:
                      - |
                        -- D3: any other spelling of create_organization (percent-
                        -- encoded, doubled `/`, upper case) is Kong's 404 here, so
                        -- the route above, and its limit, cannot be gone around.
                        local seen = kong.request.get_path()
                        for _ = 1, 4 do seen = ngx.unescape_uri(seen) end
                        if string.lower(seen):find("create_organization", 1, true) then
                          return kong.response.exit(404, '{"message":"no Route matched with those values"}', { ["Content-Type"] = "application/json" })
                        end

            ## Secure GraphQL routes
            - name: graphql-v1
              url: http://supabase-rest:3000/rpc/graphql
              routes:
                - name: graphql-v1-all
                  strip_path: true
                  paths:
                    - /graphql/v1
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Content-Profile: graphql_public"
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Content-Profile: graphql_public"
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Storage. No key-auth: a signed logo URL is fetched by an <img>
            ## with no header at all. The key mapping is the CLI's (its storage-v1
            ## route), so an `sb_` key never reaches Storage as a bearer token;
            ## an empty Authorization is then removed.
            - name: storage-v1
              url: http://supabase-storage:5000/
              routes:
                - name: storage-v1-all
                  strip_path: true
                  paths:
                    - /storage/v1/
              plugins:
                - name: cors
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: post-function
                  config:
                    access:
                      - |
                        local auth = kong.request.get_header("authorization")
                        if auth == nil or auth == "" or auth:find("^%s*$") then
                          kong.service.request.clear_header("authorization")
                        end

            ## Edge Functions. The router (story 20.2, `deploy/functions/main`)
            ## decides which function exists and which needs a session; Kong
            ## forwards with no key-auth (the cron job's invoke secret, and from
            ## 16.4 a feed token, are not keys). CORS for the app's origin only:
            ## Kong answers the preflight, and every reply, the router's own
            ## refusals included, names that origin and nothing wider.
            - name: functions-v1
              url: http://supabase-edge-functions:9000/
              read_timeout: 150000
              routes:
                - name: functions-v1-all
                  strip_path: true
                  paths:
                    - /functions/v1/
              plugins:
                - name: cors
                  config:
                    origins:
                      - $SHIFT_APP_URL
                    methods:
                      - GET
                      - POST
                      - OPTIONS
                    credentials: false
                    max_age: 3600

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    # AD-21 (story 19.1): the wrapper below refuses a half-built open door,
    # then runs the image's own command (`auth`).
    entrypoint: ['sh', '/usr/local/etc/auth-entrypoint.sh']
    mem_limit: ${AUTH_MEM_LIMIT:-112m}
    cpus: ${AUTH_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      # Every interface INSIDE the container, as the template and the CLI do;
      # only the stack's network reaches it (no `ports:`).
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=${SERVICE_URL_SUPABASEKONG}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - GOTRUE_SITE_URL=${SHIFT_APP_URL:?}
      - GOTRUE_URI_ALLOW_LIST=${SHIFT_APP_URL:?}
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      # THE DOOR (AD-21, story 19.1). Shut unless this stack's environment opens
      # it: a missing variable fails CLOSED. `staging.env.example` opens it
      # (both `false`, config.toml's values); `production.env.example` keeps
      # both `true`. `test/supabase-scaffold.test.ts` pins all three.
      - GOTRUE_DISABLE_SIGNUP=${SHIFT_DISABLE_SIGNUP:-true}
      - GOTRUE_MAILER_AUTOCONFIRM=${SHIFT_MAILER_AUTOCONFIRM:-true}
      # MIRRORED FROM supabase/config.toml, the source of the local and staging
      # auth settings (AD-10 as amended). `test/supabase-scaffold.test.ts`
      # fails when one of these differs from config.toml: change both, in one PR.
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=false
      - GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED=true
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_SMS_AUTOCONFIRM=true
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED=true
      - GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL=10
      - GOTRUE_PASSWORD_MIN_LENGTH=10
      - GOTRUE_MAILER_OTP_EXP=3600
      - GOTRUE_MAILER_OTP_LENGTH=10
      # GoTrue builds `{{ .ConfirmationURL }}` from these; Shift's templates do
      # not use it (their links are `/potvrda?token_hash=…`, AD-12), and Kong
      # refuses a GET on `/auth/v1/verify` (AD-22), so a default English mail
      # GoTrue falls back to is useless rather than consumable.
      - GOTRUE_MAILER_URLPATHS_INVITE=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/auth/v1/verify
      # Auth email (AD-17 as amended, D-S4): SMTP through Resend, with GoTrue's
      # OWN sending-only key, set in Coolify on this resource alone. Empty by
      # default, so a shut stack (production) starts without one; the wrapper
      # refuses an open door without it.
      - GOTRUE_SMTP_HOST=smtp.resend.com
      - GOTRUE_SMTP_PORT=465
      - GOTRUE_SMTP_USER=resend
      - GOTRUE_SMTP_PASS=${GOTRUE_SMTP_PASS:-}
      - GOTRUE_SMTP_ADMIN_EMAIL=${SHIFT_AUTH_EMAIL_FROM:-}
      - GOTRUE_SMTP_SENDER_NAME=Shift
      - GOTRUE_SMTP_MAX_FREQUENCY=60s
      # The Croatian templates, built from hr.json's `signup.email` keys into
      # the SPA's `dist/auth-email/` (`apps/web/src/lib/auth-email.ts`), fetched
      # from the app origin over HTTPS (D6). The subjects are the same keys'
      # `subject`; `test/auth-email.test.ts` pins both to hr.json.
      - GOTRUE_MAILER_TEMPLATES_CONFIRMATION=${SHIFT_APP_URL:?}/auth-email/confirmation.html
      - GOTRUE_MAILER_TEMPLATES_RECOVERY=${SHIFT_APP_URL:?}/auth-email/recovery.html
      - GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE=${SHIFT_APP_URL:?}/auth-email/email-change.html
      - GOTRUE_MAILER_SUBJECTS_CONFIRMATION=Potvrdi adresu e-pošte za Shift
      - GOTRUE_MAILER_SUBJECTS_RECOVERY=Nova lozinka za Shift
      - GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE=Potvrdi novu adresu e-pošte za Shift
      # GoTrue's own limits (AD-21). Its per-IP ones read the client's address
      # from Kong's `X-Real-IP`, and are off without this header. Email sent is
      # per hour for the whole stack: Resend's daily budget is shared with
      # `notify` (A9).
      - GOTRUE_RATE_LIMIT_HEADER=X-Real-IP
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=${SHIFT_AUTH_EMAIL_PER_HOUR:-10}
      - GOTRUE_RATE_LIMIT_VERIFY=30
      - GOTRUE_RATE_LIMIT_TOKEN_REFRESH=150
      # The hooks' functions are created by migrations 0003 and 0066. ORDER
      # RULE: each is pushed before GoTrue starts or restarts with it enabled.
      - GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED=true
      - GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI=pg-functions://postgres/public/custom_access_token_hook
      # On in every environment (D2): the door is shut by GOTRUE_DISABLE_SIGNUP
      # and `private.signup_settings`, never by this hook being off.
      - GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED=true
      - GOTRUE_HOOK_BEFORE_USER_CREATED_URI=pg-functions://postgres/public/before_user_created_hook
    volumes:
      - type: bind
        source: ./volumes/auth/auth-entrypoint.sh
        target: /usr/local/etc/auth-entrypoint.sh
        content: |
          #!/bin/sh
          # AD-21: GoTrue will not run an open door half-built. Run by busybox
          # sh in the image (and by `sh` in test/self-hosted-stack.test.ts),
          # then hands over to the image's own command.
          set -e
          refuse() { echo "auth-entrypoint: $1" >&2; exit 1; }

          # GoTrue reads a boolean with Go's ParseBool, which also takes 1, t,
          # T, TRUE, True, 0, f, F, FALSE and False. Only `true` and `false`
          # pass here, so no spelling can mean what the pins do not see.
          boolean() {
            case "$2" in true|false) ;; *) refuse "$1 is not exactly true or false" ;; esac
          }
          boolean GOTRUE_DISABLE_SIGNUP "$GOTRUE_DISABLE_SIGNUP"
          boolean GOTRUE_MAILER_AUTOCONFIRM "$GOTRUE_MAILER_AUTOCONFIRM"
          boolean GOTRUE_EXTERNAL_EMAIL_ENABLED "$GOTRUE_EXTERNAL_EMAIL_ENABLED"
          boolean GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED "$GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED"
          boolean GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED "$GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED"
          boolean GOTRUE_EXTERNAL_PHONE_ENABLED "$GOTRUE_EXTERNAL_PHONE_ENABLED"
          boolean GOTRUE_SMS_AUTOCONFIRM "$GOTRUE_SMS_AUTOCONFIRM"
          boolean GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED "$GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED"
          boolean GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED "$GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED"
          boolean GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED "$GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED"

          # Each template is fetched from the app origin, over HTTPS (D6), and
          # must carry a `token_hash` link: GoTrue falls back to its default
          # English mail when a fetch fails, and that mail's link is a GET on
          # `/auth/v1/verify`, which Kong refuses.
          #
          # COUPLED TO THE APP ORIGIN (DEPLOY.md §9.9): the web resource must be
          # up. After a host reboot it may come up later than GoTrue, so each
          # fetch is tried 6 times, 5 s apart, before the start is refused (and
          # Coolify restarts GoTrue, which tries again).
          template() {
            case "$2" in https'://'?*) ;; *) refuse "$1 is not an https URL" ;; esac
            tries=1
            until fetched=$(wget -q -T 10 -O - "$2" 2>/dev/null); do
              [ "$tries" -lt 6 ] || refuse "$1 does not answer 200"
              tries=$((tries + 1))
              sleep 5
            done
            case "$fetched" in *token_hash*) ;; *) refuse "$1 serves no token_hash link" ;; esac
          }

          if [ "$GOTRUE_DISABLE_SIGNUP" = false ]; then
            [ "$GOTRUE_MAILER_AUTOCONFIRM" = false ] || refuse "signup is open with GOTRUE_MAILER_AUTOCONFIRM on"
            [ -n "$GOTRUE_SMTP_HOST" ] || refuse "signup is open with no GOTRUE_SMTP_HOST"
            [ -n "$GOTRUE_SMTP_USER" ] || refuse "signup is open with no GOTRUE_SMTP_USER"
            [ -n "$GOTRUE_SMTP_PASS" ] || refuse "signup is open with no GOTRUE_SMTP_PASS"
            [ -n "$GOTRUE_SMTP_ADMIN_EMAIL" ] || refuse "signup is open with no GOTRUE_SMTP_ADMIN_EMAIL"
            [ "$GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED" = true ] || refuse "signup is open with the before-user-created hook off"
            [ "$GOTRUE_HOOK_BEFORE_USER_CREATED_URI" = 'pg-functions://postgres/public/before_user_created_hook' ] || refuse "signup is open with GOTRUE_HOOK_BEFORE_USER_CREATED_URI naming another function"
            [ -n "$GOTRUE_RATE_LIMIT_HEADER" ] || refuse "signup is open with no GOTRUE_RATE_LIMIT_HEADER (GoTrue's per-IP limits are off without it)"
          fi

          # Whenever GoTrue can send mail (its key is set), the code it mails
          # is bounded and every template it would send is Shift's: also on a
          # shut stack, where recovery and resend still reach it (AD-22).
          if [ "$GOTRUE_DISABLE_SIGNUP" = false ] || [ -n "$GOTRUE_SMTP_PASS" ]; then
            case "$GOTRUE_MAILER_OTP_EXP" in
              ''|*[!0-9]*|0*|?????*) refuse "GOTRUE_MAILER_OTP_EXP is not a number of seconds up to 3600" ;;
            esac
            [ "$GOTRUE_MAILER_OTP_EXP" -le 3600 ] || refuse "GOTRUE_MAILER_OTP_EXP is over 3600"
            [ "$GOTRUE_MAILER_OTP_LENGTH" = 10 ] || refuse "GOTRUE_MAILER_OTP_LENGTH is not 10"
            template GOTRUE_MAILER_TEMPLATES_CONFIRMATION "$GOTRUE_MAILER_TEMPLATES_CONFIRMATION"
            template GOTRUE_MAILER_TEMPLATES_RECOVERY "$GOTRUE_MAILER_TEMPLATES_RECOVERY"
            template GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE "$GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE"
          fi

          exec auth

  supabase-rest:
    image: postgrest/postgrest:v16.1
    restart: unless-stopped
    mem_limit: ${REST_MEM_LIMIT:-112m}
    cpus: ${REST_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
      # MIRRORED FROM supabase/config.toml `[api]` and `[auth] jwt_expiry`.
      - PGRST_DB_SCHEMAS=public,graphql_public
      - PGRST_DB_EXTRA_SEARCH_PATH=public,extensions
      - PGRST_DB_MAX_ROWS=1000
      - PGRST_APP_SETTINGS_JWT_EXP=3600
    command: postgrest
    exclude_from_hc: true

  supabase-storage:
    image: supabase/storage-api:v1.70.3
    restart: unless-stopped
    mem_limit: ${STORAGE_MEM_LIMIT:-224m}
    cpus: ${STORAGE_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - SERVER_PORT=5000
      - SERVER_REGION=local
      - REGION=local
      - MULTI_TENANT=false
      - TENANT_ID=stub
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - POSTGREST_URL=http://supabase-rest:3000
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - DATABASE_SEARCH_PATH=storage
      - DB_INSTALL_ROLES=false
      # The file backend on a named volume: logos only, no MinIO, no imgproxy.
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - GLOBAL_S3_BUCKET=stub
      - FILE_SIZE_LIMIT=2097152
      - ENABLE_IMAGE_TRANSFORMATION=false
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - STORAGE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG}
      - NODE_ENV=production
    volumes:
      - supabase-storage-data:/var/lib/storage

  supabase-meta:
    image: supabase/postgres-meta:v0.98.0
    restart: unless-stopped
    mem_limit: ${META_MEM_LIMIT:-112m}
    cpus: ${META_CPUS:-0.05}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_NAME=postgres
      - PG_META_DB_USER=supabase_admin
      - PG_META_DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}

  supabase-studio:
    image: supabase/studio:2026.08.17-sha-0c1da8f
    restart: unless-stopped
    # No domain and no Kong route: reached over the tailnet only
    # (`tailscale serve` in front of this loopback port).
    ports:
      - '127.0.0.1:${STUDIO_LOOPBACK_PORT:?}:3000'
    mem_limit: ${STUDIO_MEM_LIMIT:-448m}
    cpus: ${STUDIO_CPUS:-0.15}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-meta:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      # Every interface INSIDE the container, as the template does; the host
      # publishes it on the loopback only (above). Studio has no login of its
      # own: H-5 (loopback, `tailscale serve`, the Tailscale ACL) is its only
      # protection. It holds no JWT signing secret (AD-17).
      - HOSTNAME=0.0.0.0
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_HOST=supabase-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - DEFAULT_ORGANIZATION_NAME=Shift
      - DEFAULT_PROJECT_NAME=Shift
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - PG_META_CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}
      - NEXT_PUBLIC_ENABLE_LOGS=false

  supabase-edge-functions:
    # `shift-functions` (story 20.2): CLI 2.116.0's `supabase/edge-runtime:v1.74.3`
    # with the router (`deploy/functions/main`) as its main service and each
    # function bundled in at build time, built by CI from
    # `deploy/functions/Dockerfile`. The reference is per environment and
    # holds no secret: the channel tag `ghcr.io/<owner>/shift-functions:<environment>`,
    # which the deploy pipeline (story 20.6) points at the probed digest
    # before it restarts the stack with its images pulled again. Pulled on
    # every start, so a moved tag is never served from a stale local copy.
    image: ${SHIFT_FUNCTIONS_IMAGE:?}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${FUNCTIONS_MEM_LIMIT:-448m}
    cpus: ${FUNCTIONS_CPUS:-0.15}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-kong:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
    # The main service listens: a TCP connect with the image's own bash (it
    # ships no HTTP client). Not an HTTP probe: the router answers no health
    # path, only its functions (anything else is 404).
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      timeout: 5s
      interval: 5s
      retries: 3
      # A cold start on a 0.15 CPU share: failures here do not count.
      start_period: 30s
    environment:
      # The router's only own variable: GoTrue, asked directly on the stack's
      # network for every `verify_jwt` function (Kong's auth route would need
      # an apikey, and the router holds none).
      - SHIFT_AUTH_URL=http://supabase-auth:9999
      # The internal gateway: a function's own calls never leave the host.
      - SUPABASE_URL=http://supabase-kong:8000
      # The functions' own names (AD-17). The opaque keys are the same values
      # Kong maps; the functions hold no JWT, no signing secret and no
      # database password.
      - SHIFT_SECRET_KEY=sb_secret_${SERVICE_PASSWORD_64_SECRETKEY}
      - SHIFT_PUBLISHABLE_KEY=sb_publishable_${SERVICE_PASSWORD_64_PUBLISHABLEKEY}
      - SHIFT_ALLOWED_ORIGINS=${SHIFT_APP_URL:?}
      - SHIFT_APP_URL=${SHIFT_APP_URL:?}
      # Also stored in this stack's Vault as `notify_invoke_secret` (DEPLOY.md §3a).
      - NOTIFY_INVOKE_SECRET=${SERVICE_PASSWORD_64_NOTIFYINVOKE}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:?}
      # Operator-set: no generator can make these.
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?}
      - VAPID_SUBJECT=${VAPID_SUBJECT:?}
    command:
      - start
      - --main-service
      - /home/deno/functions/main

volumes:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
