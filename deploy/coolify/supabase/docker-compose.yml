          # `Bearer sb_…`; otherwise `apikey` decides: the secret key becomes the
          # service_role JWT, the publishable key the anon JWT. The same mapping
          # as Supabase CLI 2.116.0's local stack (`legacyBuildKongBearerToken`).
          export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SUPABASE_SERVICE_KEY') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $SUPABASE_ANON_KEY') or headers.apikey)"

          awk '{
            result = ""
            rest = $0
            while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
              varname = substr(rest, RSTART + 1, RLENGTH - 1)
              if (varname in ENVIRON) {
                result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
              } else {
                result = result substr(rest, 1, RSTART + RLENGTH - 1)
              }
              rest = substr(rest, RSTART + RLENGTH)
            }
            print result rest
          }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"

          exec /docker-entrypoint.sh kong docker-start
      - type: bind
        source: ./volumes/api/log-redaction.conf
        target: /home/kong/log-redaction.conf
        content: |
          # Included in nginx's http block (KONG_NGINX_HTTP_INCLUDE). NFR-27:
          # a token is never written to a log in full. The first rule that
          # matches wins:
          #   1. a function's path: its name, then `[redacted]` for whatever
          #      follows it (a sub-path, an encoded character, a query);
          #   2. any other request with a query string: the path, then
          #      `?[redacted]` (Storage's signed URLs carry `?token=`);
          #   3. anything else, as sent.
          # (Variables are written `$name`, never in braces: braces are what
          # Coolify reads as its own variables.)
          map $request_uri $shift_logged_uri {
            "~*^(?<shift_function>[^?]*?/functions/v1/[a-z0-9_-]*)[^a-z0-9_-]" "$shift_function[redacted]";
            "~^(?<shift_path>[^?]*)[?]" "$shift_path?[redacted]";
            default $request_uri;
          }
          log_format shift_redacted '$remote_addr - [$time_local] "$request_method $shift_logged_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        content: |
          _format_version: '2.1'
          _transform: true

          ###
          ### Consumers: each role answers to its JWT and to its opaque key.
          ###
          consumers:
            - username: anon
              keyauth_credentials:
                - key: $SUPABASE_ANON_KEY
                - key: $SUPABASE_PUBLISHABLE_KEY
            - username: service_role
              keyauth_credentials:
                - key: $SUPABASE_SERVICE_KEY
                - key: $SUPABASE_SECRET_KEY

          acls:
            - consumer: anon
              group: anon
            - consumer: service_role
              group: admin

          ###
          ### Routes. Auth, REST, GraphQL, Storage and Functions only: no Studio,
          ### no pg-meta, no catch-all.
          ###
          services:
            ## Auth: an ALLOW-LIST (AD-22, story 19.1). Each path is a route of
            ## its own, a regex anchored by its trailing `$` (Kong 2.8 anchors the
            ## start), so a trailing `/` or a `;` matches nothing. Every other
            ## path under `/auth/v1/` (otp, magiclink, reauthenticate, invite,
            ## authorize, callback, factors, sso, settings, a GET on verify, ...)
            ## is Kong's own 404.
            ## There is no catch-all. OPTIONS is in every browser-called route's
            ## methods, so `cors` answers its preflight before key-auth (D7).
            ## The rehearsal (spec 19.1) found that Kong 2.8 matches a regex
            ## route on the NORMALIZED path, so each route's pre-function also
            ## refuses any spelling but its own (a doubled `/`, `%75`).
            ##
            ## signup, recover and resend: one route, so one limit counts all
            ## three. GoTrue never answers the client (AD-22).
            - name: auth-v1-mail
              url: http://supabase-auth:9999/
              routes:
                - name: auth-v1-mail
                  strip_path: true
                  methods:
                    - POST
                    - OPTIONS
                  paths:
                    - /auth/v1/signup$
                    - /auth/v1/recover$
                    - /auth/v1/resend$
              plugins:
                - name: pre-function
                  config:
                    access:
                      - |
                        -- AD-22: Kong 2.8 matches a route on the normalized path, so a
                        -- doubled `/` or a percent-encoded letter reaches it too. Only
                        -- the path as the allow-list writes it passes; any other
                        -- spelling is Kong's own 404. A pre-function runs first of
                        -- all (before cors, key-auth and the limit), so a variant is
                        -- 404 with or without a key, and counts against no limit.
                        local allowed = { ["/auth/v1/signup"] = true, ["/auth/v1/recover"] = true, ["/auth/v1/resend"] = true }
                        if not allowed[kong.request.get_path()] then
                          return kong.response.exit(404, '{"message":"no Route matched with those values"}', { ["Content-Type"] = "application/json; charset=utf-8" })
                        end
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon
                - name: rate-limiting
                  config:
                    hour: $SHIFT_LIMIT_MAIL_HOUR
                    day: $SHIFT_LIMIT_MAIL_DAY
                    limit_by: ip
                    policy: local
                    hide_client_headers: true
                - name: post-function
                  config:
                    access:
                      - |
                        -- AD-22: one answer, `200 {}`, for every body, made here and
                        -- never by GoTrue. A readable body with an email
                        -- identity's address is then relayed in the background,
                        -- rebuilt from its route's fields alone.
                        local cjson = require("cjson.safe")
                        local http = require("resty.http")
                        -- address_kind: AD-12's predicate, the same rule as
                        -- private.address_kind (0066) and the vectors in
                        -- test/fixtures/synthesized-addresses.json.
                        local function address_kind(address)
                          if type(address) ~= "string" then return "malformed" end
                          local first, last = 1, #address
                          local function blank(byte) return byte == 32 or (byte >= 9 and byte <= 13) end
                          while first <= last and blank(address:byte(first)) do first = first + 1 end
                          while last >= first and blank(address:byte(last)) do last = last - 1 end
                          local normalized = address:sub(first, last):gsub("[A-Z]", string.lower)
                          if normalized:find('"', 1, true) or normalized:find("'", 1, true) then return "malformed" end
                          local at = normalized:find("@", 1, true)
                          if at == nil or normalized:find("@", at + 1, true) then return "malformed" end
                          local local_part = normalized:sub(1, at - 1)
                          local domain = normalized:sub(at + 1)
                          if domain:sub(-1) == "." then domain = domain:sub(1, -2) end
                          if local_part == "" or domain == "" then return "malformed" end
                          if domain == "shift.invalid" or domain:sub(-14) == ".shift.invalid" then
                            return "synthesized"
                          end
                          return "email"
                        end
                        -- end address_kind
                        local routes = { ["/auth/v1/signup"] = "signup", ["/auth/v1/recover"] = "recover", ["/auth/v1/resend"] = "resend" }
                        local route = routes[kong.request.get_path()]
                        local payload
                        if route ~= nil and kong.request.get_method() == "POST" then
                          local raw = kong.request.get_raw_body()
                          -- nil when Kong could not read the body (one buffered to a
                          -- file): a fixed code, so a dropped request still shows.
                          if raw == nil then ngx.log(ngx.ERR, "AUTH_MAIL_RELAY ", route, " UNREAD") end
                          local body = cjson.decode(raw or "")
                          if type(body) == "table" and address_kind(body.email) == "email" then
                            if route == "signup" then
                              if type(body.password) == "string" then payload = { email = body.email, password = body.password } end
                            elseif route == "recover" then
                              payload = { email = body.email }
                            else
                              payload = { email = body.email, type = "signup" }
                            end
                          end
                        end
                        if payload ~= nil then
                          local encoded = cjson.encode(payload)
                          local client_ip = kong.client.get_forwarded_ip()
                          -- D8: a failed relay is logged as a fixed code and
                          -- GoTrue's status, never with the address.
                          local scheduled = ngx.timer.at(0, function(premature)
                            if premature then return end
                            local client = http.new()
                            client:set_timeout(15000)
                            local answer = client:request_uri("http://supabase-auth:9999/" .. route, {
                              method = "POST",
                              body = encoded,
                              headers = { ["Content-Type"] = "application/json", ["X-Real-IP"] = client_ip },
                            })
                            local status = answer and answer.status or 0
                            if status < 200 or status > 299 then
                              ngx.log(ngx.ERR, "AUTH_MAIL_RELAY ", route, " ", status)
                            end
                          end)
                          if not scheduled then ngx.log(ngx.ERR, "AUTH_MAIL_RELAY ", route, " 0") end
                        end
                        return kong.response.exit(200, "{}", { ["Content-Type"] = "application/json" })

            ## The password and refresh grants, with their limit.
            - name: auth-v1-token
              url: http://supabase-auth:9999/token
              routes:
                - name: auth-v1-token
                  strip_path: true
                  methods:
                    - POST
                    - OPTIONS
                  paths:
