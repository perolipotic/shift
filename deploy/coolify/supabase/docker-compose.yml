# Shift's self-hosted Supabase stack, run by Coolify (story 20.1).
#
# Derived from Coolify's Supabase service template, `templates/compose/supabase.yaml`
# at Coolify v4.7.6 (commit b7cbdb480faa1a124423e3c3c886481848c96cf9), and trimmed to
# the eight services Shift uses:
# https://github.com/coollabsio/coolify/blob/b7cbdb480faa1a124423e3c3c886481848c96cf9/templates/compose/supabase.yaml
# Every image is pinned at the version Supabase CLI
# 2.116.0 runs locally (`apps/cli-go/pkg/config/templates/Dockerfile` at v2.116.0),
# so staging and production run what `supabase start` runs.
#
# THIS FILE IS THE SOURCE OF TRUTH. It is pasted into a Coolify "Docker Compose"
# resource per environment (shift-staging, shift-production) and never edited in
# Coolify. A change is a reviewed change here. `test/self-hosted-stack.test.ts` and
# `test/supabase-scaffold.test.ts` pin it; DEPLOY.md "Self-hosted stack" runs it.
#
# The repository is public: no address, hostname, host port or secret belongs
# here. Per-environment inputs come from `staging.env.example` and
# `production.env.example`, which hold placeholders only.
#
# Secrets. Every secret is generated by Coolify (`SERVICE_PASSWORD_*`, and the
# HS256 role JWTs `SERVICE_SUPABASEANON_KEY` / `SERVICE_SUPABASESERVICE_KEY` that
# Coolify signs with `SERVICE_PASSWORD_JWT`), never with a default. The ones no
# generator can make (the Resend key, the VAPID pair) are operator-set, also
# with no default. The JWT signing secret reaches GoTrue, PostgREST and Storage
# only: never Kong, Studio or edge-runtime (AD-17 as amended).
#
# Keys (AD-17, settled by 20.1). The stack's keys are the opaque
# `sb_publishable_…` / `sb_secret_…` form. Kong maps each to the stack's role JWT
# before the request reaches GoTrue, PostgREST or Storage, exactly as the CLI's
# local stack does (`legacyBuildKongBearerToken`), so no service behind Kong is
# ever authenticated by an `sb_` key. (The `apikey` header itself is forwarded
# as it came, as the CLI forwards it: `hide_credentials: false`.)
#
# Trimmed from the template: Realtime, analytics (Logflare), Vector, Supavisor,
# MinIO, imgproxy; Kong's Studio catch-all, `/pg/`, MCP and SAML routes; the
# `jwt.sql`, `realtime.sql`, `_supabase.sql`, `pooler.sql` and `logs.sql` init
# scripts; `PGRST_APP_SETTINGS_JWT_SECRET`; the template's sample functions.
#
# Every service restarts unless stopped (stated here, not left to Coolify's
# injection), so the stack comes back after a host reboot.
#
# Every memory and CPU limit defaults to staging's value: a missing variable
# fails LOW, so a stack can never take more than staging's share by omission.
# `production.env.example` raises them.

services:
  supabase-db:
    image: supabase/postgres:17.6.1.165
    restart: unless-stopped
    # Postgres is reached by the operator and CI only over the tailnet
    # (`tailscale serve --tcp` in front of this loopback port), never publicly.
    ports:
      - '127.0.0.1:${POSTGRES_LOOPBACK_PORT:?}:5432'
    mem_limit: ${DB_MEM_LIMIT:-640m}
    cpus: ${DB_CPUS:-0.25}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - PGPORT=5432
      - POSTGRES_PORT=5432
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=postgres
      - POSTGRES_DB=postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # pgsodium's root key lives here; it must survive a restart.
      - supabase-db-config:/etc/postgresql-custom
      # The two init scripts kept from the template (`roles.sql` with its
      # "change to your own passwords" note replaced: they are generated). `webhooks.sql`
      # creates `supabase_functions` and pg_net's grants; `roles.sql` gives the
      # service roles the generated Postgres password.
      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        content: |
          BEGIN;
          -- Create pg_net extension
          CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
          -- Create supabase_functions schema
          CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
          GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
          -- supabase_functions.migrations definition
          CREATE TABLE supabase_functions.migrations (
            version text PRIMARY KEY,
            inserted_at timestamptz NOT NULL DEFAULT NOW()
          );
          -- Initial supabase_functions migration
          INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
          -- supabase_functions.hooks definition
          CREATE TABLE supabase_functions.hooks (
            id bigserial PRIMARY KEY,
            hook_table_id integer NOT NULL,
            hook_name text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT NOW(),
            request_id bigint
          );
          CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
          CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
          COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
          CREATE FUNCTION supabase_functions.http_request()
            RETURNS trigger
            LANGUAGE plpgsql
            AS $function$
            DECLARE
              request_id bigint;
              payload jsonb;
              url text := TG_ARGV[0]::text;
              method text := TG_ARGV[1]::text;
              headers jsonb DEFAULT '{}'::jsonb;
              params jsonb DEFAULT '{}'::jsonb;
              timeout_ms integer DEFAULT 1000;
            BEGIN
              IF url IS NULL OR url = 'null' THEN
                RAISE EXCEPTION 'url argument is missing';
              END IF;

              IF method IS NULL OR method = 'null' THEN
                RAISE EXCEPTION 'method argument is missing';
              END IF;

              IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
                headers = '{"Content-Type": "application/json"}'::jsonb;
              ELSE
                headers = TG_ARGV[2]::jsonb;
              END IF;

              IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
                params = '{}'::jsonb;
              ELSE
                params = TG_ARGV[3]::jsonb;
              END IF;

              IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
                timeout_ms = 1000;
              ELSE
                timeout_ms = TG_ARGV[4]::integer;
              END IF;

              CASE
                WHEN method = 'GET' THEN
                  SELECT http_get INTO request_id FROM net.http_get(
                    url,
                    params,
                    headers,
                    timeout_ms
                  );
                WHEN method = 'POST' THEN
                  payload = jsonb_build_object(
                    'old_record', OLD,
                    'record', NEW,
                    'type', TG_OP,
                    'table', TG_TABLE_NAME,
                    'schema', TG_TABLE_SCHEMA
                  );

                  SELECT http_post INTO request_id FROM net.http_post(
                    url,
                    payload,
                    params,
                    headers,
                    timeout_ms
                  );
                ELSE
                  RAISE EXCEPTION 'method argument % is invalid', method;
              END CASE;

              INSERT INTO supabase_functions.hooks
                (hook_table_id, hook_name, request_id)
              VALUES
                (TG_RELID, TG_NAME, request_id);

              RETURN NEW;
            END
          $function$;
          -- Supabase super admin
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_functions_admin'
            )
            THEN
              CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
          ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
          ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
          ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
          ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
          GRANT supabase_functions_admin TO postgres;
          -- Remove unused supabase_pg_net_admin role
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_pg_net_admin'
            )
            THEN
              REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
              DROP OWNED BY supabase_pg_net_admin;
              DROP ROLE supabase_pg_net_admin;
            END IF;
          END
          $$;
          -- pg_net grants when extension is already enabled
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END
          $$;
          -- Event trigger for pg_net
          CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_event_trigger_ddl_commands() AS ev
              JOIN pg_extension AS ext
              ON ev.objid = ext.oid
              WHERE ext.extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END;
          $$;
          COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_event_trigger
              WHERE evtname = 'issue_pg_net_access'
            ) THEN
              CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
              EXECUTE PROCEDURE extensions.grant_pg_net_access();
            END IF;
          END
          $$;
          INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
          ALTER function supabase_functions.http_request() SECURITY DEFINER;
          ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
          REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
          COMMIT;
      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |
          -- The generated Postgres password, for every service role. Runs only on
          -- an empty data volume: rotating the password means re-running these
          -- ALTER USER statements by hand (DEPLOY.md §9.4).
           \set pgpass `echo "$POSTGRES_PASSWORD"`

           ALTER USER authenticator WITH PASSWORD :'pgpass';
           ALTER USER pgbouncer WITH PASSWORD :'pgpass';
           ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';

  supabase-kong:
    # The CLI's own Kong (`library/kong:2.8.1`), not the template's 3.9.1.
    image: kong:2.8.1
    restart: unless-stopped
    # The only public route into the stack: Coolify's Traefik serves this
    # service at `api.<domain>` with TLS. No `ports:` of its own.
    entrypoint: ['sh', '/home/kong/kong-entrypoint.sh']
    mem_limit: ${KONG_MEM_LIMIT:-192m}
    cpus: ${KONG_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - SERVICE_URL_SUPABASEKONG_8000
      - KONG_PORT_MAPS=443:8000
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
      # supabase/cli issue 14
      - KONG_DNS_ORDER=LAST,A,CNAME
      - KONG_DNS_NOT_FOUND_TTL=1
      - KONG_PLUGINS=request-transformer,cors,key-auth,acl,post-function
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      - KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k
      # NFR-27 (story 20.2): the access log is written in `shift_redacted`, from
      # the included file below: no query string on any route (Storage's
      # signed `?token=`), nothing after a function's name (v2's
      # `calendar-feed/<token>`), no referer.
      - KONG_NGINX_HTTP_INCLUDE=/home/kong/log-redaction.conf
      - 'KONG_PROXY_ACCESS_LOG=/dev/stdout shift_redacted'
      # The one origin the functions route answers CORS for (story 20.2).
      - SHIFT_APP_URL=${SHIFT_APP_URL:?}
      # Both role JWTs and both opaque keys; NOT the signing secret.
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - SUPABASE_PUBLISHABLE_KEY=sb_publishable_${SERVICE_PASSWORD_64_PUBLISHABLEKEY}
      - SUPABASE_SECRET_KEY=sb_secret_${SERVICE_PASSWORD_64_SECRETKEY}
    volumes:
      - type: bind
        source: ./volumes/api/kong-entrypoint.sh
        target: /home/kong/kong-entrypoint.sh
        content: |
          #!/bin/sh
          # Builds the Lua expression that maps an opaque key to its role JWT,
          # substitutes $VARS into the declarative config, and starts Kong.
          #
          # The substitution is awk over ENVIRON, never `eval echo`: the Lua
          # expression contains `$(…)`, which a shell would run as a command.
          set -e  # not -u: an unset key must reach the checks below and fail there

          # FAIL CLOSED. An empty generated value would make the bare prefix
          # `sb_secret_` a service_role credential, so Kong refuses to start
          # unless both role JWTs are set and each opaque key carries at least
          # 32 characters after its prefix.
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "kong-entrypoint: SUPABASE_ANON_KEY is empty" >&2; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "kong-entrypoint: SUPABASE_SERVICE_KEY is empty" >&2; exit 1; fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_????????????????????????????????*) ;;
            *) echo "kong-entrypoint: SUPABASE_PUBLISHABLE_KEY is empty or too short" >&2; exit 1 ;;
          esac
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_????????????????????????????????*) ;;
            *) echo "kong-entrypoint: SUPABASE_SECRET_KEY is empty or too short" >&2; exit 1 ;;
          esac
          # Each value is spliced into a single-quoted Lua string and into YAML:
          # a quote, a backslash or a space would break out of it. The opaque
          # keys are `sb_` + letters and digits, the JWTs base64url and dots.
          # (Spelled out, with no brace expansion, no `eval` and no external
          # tool: Coolify reads `${…}` as its own variables, and a missing tool
          # would print nothing, which would pass.)
          case "$SUPABASE_PUBLISHABLE_KEY" in *[!A-Za-z0-9._-]*) echo "kong-entrypoint: SUPABASE_PUBLISHABLE_KEY holds a character outside [A-Za-z0-9._-]" >&2; exit 1 ;; esac
          case "$SUPABASE_SECRET_KEY" in *[!A-Za-z0-9._-]*) echo "kong-entrypoint: SUPABASE_SECRET_KEY holds a character outside [A-Za-z0-9._-]" >&2; exit 1 ;; esac
          case "$SUPABASE_ANON_KEY" in *[!A-Za-z0-9._-]*) echo "kong-entrypoint: SUPABASE_ANON_KEY holds a character outside [A-Za-z0-9._-]" >&2; exit 1 ;; esac
          case "$SUPABASE_SERVICE_KEY" in *[!A-Za-z0-9._-]*) echo "kong-entrypoint: SUPABASE_SERVICE_KEY holds a character outside [A-Za-z0-9._-]" >&2; exit 1 ;; esac
          # One credential per role: the two keys and the two JWTs differ.
          if [ "$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | cut -c16-)" = "$(printf '%s' "$SUPABASE_SECRET_KEY" | cut -c11-)" ]; then
            echo "kong-entrypoint: the publishable and secret keys are the same value" >&2; exit 1
          fi
          if [ "$SUPABASE_ANON_KEY" = "$SUPABASE_SERVICE_KEY" ]; then
            echo "kong-entrypoint: the anon and service_role JWTs are the same value" >&2; exit 1
          fi
          # The app's origin, spliced into the functions route's CORS `origins`
          # (YAML): an http(s) origin with no path, and only the characters Kong
          # 2.8's cors plugin compares as a plain string, never as a regex.
          case "$SHIFT_APP_URL" in
            http'://'?*|https'://'?*) ;;  # quoted: no literal scheme-and-host here
            *) echo "kong-entrypoint: SHIFT_APP_URL is not an http(s) origin" >&2; exit 1 ;;
          esac
          case "${SHIFT_APP_URL#*://}" in */*) echo "kong-entrypoint: SHIFT_APP_URL carries a path" >&2; exit 1 ;; esac
          # A browser's Origin is lower-case and starts with the host.
          case "${SHIFT_APP_URL#*://}" in [a-z0-9]*) ;; *) echo "kong-entrypoint: SHIFT_APP_URL has no host" >&2; exit 1 ;; esac
          case "$SHIFT_APP_URL" in *[A-Z]*) echo "kong-entrypoint: SHIFT_APP_URL is not lower-case" >&2; exit 1 ;; esac
          case "$SHIFT_APP_URL" in *[!A-Za-z0-9.:/-]*) echo "kong-entrypoint: SHIFT_APP_URL holds a character outside [A-Za-z0-9.:/-]" >&2; exit 1 ;; esac
          # A browser's Origin never carries an empty or a default port.
          case "$SHIFT_APP_URL" in *:|https'://'*:443|http'://'*:80) echo "kong-entrypoint: SHIFT_APP_URL has an empty or default port" >&2; exit 1 ;; esac

          # A caller's own `Authorization` passes through unless it is
          # `Bearer sb_…`; otherwise `apikey` decides: the secret key becomes the
          # service_role JWT, the publishable key the anon JWT. The same mapping
          # as Supabase CLI 2.116.0's local stack (`legacyBuildKongBearerToken`).
          export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SUPABASE_SERVICE_KEY') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $SUPABASE_ANON_KEY') or headers.apikey)"

          awk '{
            result = ""
            rest = $0
            while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
              varname = substr(rest, RSTART + 1, RLENGTH - 1)
              if (varname in ENVIRON) {
                result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
              } else {
                result = result substr(rest, 1, RSTART + RLENGTH - 1)
              }
              rest = substr(rest, RSTART + RLENGTH)
            }
            print result rest
          }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"

          exec /docker-entrypoint.sh kong docker-start
      - type: bind
        source: ./volumes/api/log-redaction.conf
        target: /home/kong/log-redaction.conf
        content: |
          # Included in nginx's http block (KONG_NGINX_HTTP_INCLUDE). NFR-27:
          # a token is never written to a log in full. The first rule that
          # matches wins:
          #   1. a function's path: its name, then `[redacted]` for whatever
          #      follows it (a sub-path, an encoded character, a query);
          #   2. any other request with a query string: the path, then
          #      `?[redacted]` (Storage's signed URLs carry `?token=`);
          #   3. anything else, as sent.
          # (Variables are written `$name`, never in braces: braces are what
          # Coolify reads as its own variables.)
          map $request_uri $shift_logged_uri {
            "~*^(?<shift_function>[^?]*?/functions/v1/[a-z0-9_-]*)[^a-z0-9_-]" "$shift_function[redacted]";
            "~^(?<shift_path>[^?]*)[?]" "$shift_path?[redacted]";
            default $request_uri;
          }
          log_format shift_redacted '$remote_addr - [$time_local] "$request_method $shift_logged_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        content: |
          _format_version: '2.1'
          _transform: true

          ###
          ### Consumers: each role answers to its JWT and to its opaque key.
          ###
          consumers:
            - username: anon
              keyauth_credentials:
                - key: $SUPABASE_ANON_KEY
                - key: $SUPABASE_PUBLISHABLE_KEY
            - username: service_role
              keyauth_credentials:
                - key: $SUPABASE_SERVICE_KEY
                - key: $SUPABASE_SECRET_KEY

          acls:
            - consumer: anon
              group: anon
            - consumer: service_role
              group: admin

          ###
          ### Routes. Auth, REST, GraphQL, Storage and Functions only: no Studio,
          ### no pg-meta, no catch-all.
          ###
          services:
            ## Open Auth routes
            - name: auth-v1-open
              url: http://supabase-auth:9999/verify
              routes:
                - name: auth-v1-open
                  strip_path: true
                  paths:
                    - /auth/v1/verify
              plugins:
                - name: cors
            - name: auth-v1-open-callback
              url: http://supabase-auth:9999/callback
              routes:
                - name: auth-v1-open-callback
                  strip_path: true
                  paths:
                    - /auth/v1/callback
              plugins:
                - name: cors
            - name: auth-v1-open-authorize
              url: http://supabase-auth:9999/authorize
              routes:
                - name: auth-v1-open-authorize
                  strip_path: true
                  paths:
                    - /auth/v1/authorize
              plugins:
                - name: cors
            - name: auth-v1-open-jwks
              url: http://supabase-auth:9999/.well-known/jwks.json
              routes:
                - name: auth-v1-open-jwks
                  strip_path: true
                  paths:
                    - /auth/v1/.well-known/jwks.json
              plugins:
                - name: cors

            ## Secure Auth routes
            - name: auth-v1
              url: http://supabase-auth:9999/
              routes:
                - name: auth-v1-all
                  strip_path: true
                  paths:
                    - /auth/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Secure REST routes
            - name: rest-v1
              url: http://supabase-rest:3000/
              routes:
                - name: rest-v1-all
                  strip_path: true
                  paths:
                    - /rest/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Secure GraphQL routes
            - name: graphql-v1
              url: http://supabase-rest:3000/rpc/graphql
              routes:
                - name: graphql-v1-all
                  strip_path: true
                  paths:
                    - /graphql/v1
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                    # The header only: the mapping below reads `headers.apikey`,
                    # and a key in the query string would be logged by Kong.
                    key_in_query: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Content-Profile: graphql_public"
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Content-Profile: graphql_public"
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Storage. No key-auth: a signed logo URL is fetched by an <img>
            ## with no header at all. The key mapping is the CLI's (its storage-v1
            ## route), so an `sb_` key never reaches Storage as a bearer token;
            ## an empty Authorization is then removed.
            - name: storage-v1
              url: http://supabase-storage:5000/
              routes:
                - name: storage-v1-all
                  strip_path: true
                  paths:
                    - /storage/v1/
              plugins:
                - name: cors
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: post-function
                  config:
                    access:
                      - |
                        local auth = kong.request.get_header("authorization")
                        if auth == nil or auth == "" or auth:find("^%s*$") then
                          kong.service.request.clear_header("authorization")
                        end

            ## Edge Functions. The router (story 20.2, `deploy/functions/main`)
            ## decides which function exists and which needs a session; Kong
            ## forwards with no key-auth (the cron job's invoke secret, and from
            ## 16.4 a feed token, are not keys). CORS for the app's origin only:
            ## Kong answers the preflight, and every reply, the router's own
            ## refusals included, names that origin and nothing wider.
            - name: functions-v1
              url: http://supabase-edge-functions:9000/
              read_timeout: 150000
              routes:
                - name: functions-v1-all
                  strip_path: true
                  paths:
                    - /functions/v1/
              plugins:
                - name: cors
                  config:
                    origins:
                      - $SHIFT_APP_URL
                    methods:
                      - GET
                      - POST
                      - OPTIONS
                    credentials: false
                    max_age: 3600

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    mem_limit: ${AUTH_MEM_LIMIT:-112m}
    cpus: ${AUTH_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      # Every interface INSIDE the container, as the template and the CLI do;
      # only the stack's network reaches it (no `ports:`).
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=${SERVICE_URL_SUPABASEKONG}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - GOTRUE_SITE_URL=${SHIFT_APP_URL:?}
      - GOTRUE_URI_ALLOW_LIST=${SHIFT_APP_URL:?}
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      # MIRRORED FROM supabase/config.toml, which stays the single source of the
      # auth settings (AD-10 as amended). `test/supabase-scaffold.test.ts` fails
      # when one of these differs from config.toml: change both, in one PR.
      - GOTRUE_DISABLE_SIGNUP=true
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED=true
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_SMS_AUTOCONFIRM=true
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED=true
      - GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL=10
      - GOTRUE_PASSWORD_MIN_LENGTH=10
      # No SMTP until Epic 19 (AD-12: v1 sends no auth mail). The paths are the
      # template's, so a link GoTrue builds later goes through Kong's open route.
      - GOTRUE_MAILER_URLPATHS_INVITE=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/auth/v1/verify
      # The hook's function is created by migration 0003. ORDER RULE: that
      # migration is pushed before GoTrue starts or restarts with this enabled.
      - GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED=true
      - GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI=pg-functions://postgres/public/custom_access_token_hook

  supabase-rest:
    image: postgrest/postgrest:v16.1
    restart: unless-stopped
    mem_limit: ${REST_MEM_LIMIT:-112m}
    cpus: ${REST_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
      # MIRRORED FROM supabase/config.toml `[api]` and `[auth] jwt_expiry`.
      - PGRST_DB_SCHEMAS=public,graphql_public
      - PGRST_DB_EXTRA_SEARCH_PATH=public,extensions
      - PGRST_DB_MAX_ROWS=1000
      - PGRST_APP_SETTINGS_JWT_EXP=3600
    command: postgrest
    exclude_from_hc: true

  supabase-storage:
    image: supabase/storage-api:v1.70.3
    restart: unless-stopped
    mem_limit: ${STORAGE_MEM_LIMIT:-224m}
    cpus: ${STORAGE_CPUS:-0.1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - SERVER_PORT=5000
      - SERVER_REGION=local
      - REGION=local
      - MULTI_TENANT=false
      - TENANT_ID=stub
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - POSTGREST_URL=http://supabase-rest:3000
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:5432/postgres
      - DATABASE_SEARCH_PATH=storage
      - DB_INSTALL_ROLES=false
      # The file backend on a named volume: logos only, no MinIO, no imgproxy.
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - GLOBAL_S3_BUCKET=stub
      - FILE_SIZE_LIMIT=2097152
      - ENABLE_IMAGE_TRANSFORMATION=false
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - STORAGE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG}
      - NODE_ENV=production
    volumes:
      - supabase-storage-data:/var/lib/storage

  supabase-meta:
    image: supabase/postgres-meta:v0.98.0
    restart: unless-stopped
    mem_limit: ${META_MEM_LIMIT:-112m}
    cpus: ${META_CPUS:-0.05}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_NAME=postgres
      - PG_META_DB_USER=supabase_admin
      - PG_META_DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}

  supabase-studio:
    image: supabase/studio:2026.08.17-sha-0c1da8f
    restart: unless-stopped
    # No domain and no Kong route: reached over the tailnet only
    # (`tailscale serve` in front of this loopback port).
    ports:
      - '127.0.0.1:${STUDIO_LOOPBACK_PORT:?}:3000'
    mem_limit: ${STUDIO_MEM_LIMIT:-448m}
    cpus: ${STUDIO_CPUS:-0.15}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-meta:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      # Every interface INSIDE the container, as the template does; the host
      # publishes it on the loopback only (above). Studio has no login of its
      # own: H-5 (loopback, `tailscale serve`, the Tailscale ACL) is its only
      # protection. It holds no JWT signing secret (AD-17).
      - HOSTNAME=0.0.0.0
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_HOST=supabase-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - DEFAULT_ORGANIZATION_NAME=Shift
      - DEFAULT_PROJECT_NAME=Shift
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - PG_META_CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}
      - NEXT_PUBLIC_ENABLE_LOGS=false

  supabase-edge-functions:
    # `shift-functions` (story 20.2): CLI 2.116.0's `supabase/edge-runtime:v1.74.3`
    # with the router (`deploy/functions/main`) as its main service and each
    # function bundled in at build time, built by CI from
    # `deploy/functions/Dockerfile`. The reference is per environment
    # (`<registry>/shift-functions:<sha>`) and holds no secret.
    image: ${SHIFT_FUNCTIONS_IMAGE:?}
    restart: unless-stopped
    mem_limit: ${FUNCTIONS_MEM_LIMIT:-448m}
    cpus: ${FUNCTIONS_CPUS:-0.15}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      supabase-kong:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
    # The main service listens: a TCP connect with the image's own bash (it
    # ships no HTTP client). Not an HTTP probe: the router answers no health
    # path, only its functions (anything else is 404).
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      timeout: 5s
      interval: 5s
      retries: 3
      # A cold start on a 0.15 CPU share: failures here do not count.
      start_period: 30s
    environment:
      # The router's only own variable: GoTrue, asked directly on the stack's
      # network for every `verify_jwt` function (Kong's auth route would need
      # an apikey, and the router holds none).
      - SHIFT_AUTH_URL=http://supabase-auth:9999
      # The internal gateway: a function's own calls never leave the host.
      - SUPABASE_URL=http://supabase-kong:8000
      # The functions' own names (AD-17). The opaque keys are the same values
      # Kong maps; the functions hold no JWT, no signing secret and no
      # database password.
      - SHIFT_SECRET_KEY=sb_secret_${SERVICE_PASSWORD_64_SECRETKEY}
      - SHIFT_PUBLISHABLE_KEY=sb_publishable_${SERVICE_PASSWORD_64_PUBLISHABLEKEY}
      - SHIFT_ALLOWED_ORIGINS=${SHIFT_APP_URL:?}
      - SHIFT_APP_URL=${SHIFT_APP_URL:?}
      # Also stored in this stack's Vault as `notify_invoke_secret` (DEPLOY.md §3a).
      - NOTIFY_INVOKE_SECRET=${SERVICE_PASSWORD_64_NOTIFYINVOKE}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:?}
      # Operator-set: no generator can make these.
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?}
      - VAPID_SUBJECT=${VAPID_SUBJECT:?}
    command:
      - start
      - --main-service
      - /home/deno/functions/main

volumes:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
