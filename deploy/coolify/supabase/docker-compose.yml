                - name: rate-limiting
                  config:
                    minute: $SHIFT_LIMIT_VERIFY_MINUTE
                    hour: $SHIFT_LIMIT_VERIFY_HOUR
                    limit_by: ip
                    policy: local
                    hide_client_headers: true
                - name: post-function
                  config:
                    access:
                      - |
                        -- AD-22: a link's `{token_hash, type}` and nothing else
                        -- (supabase-js adds `gotrue_meta_security`, which is
                        -- dropped). An email-plus-code body never reaches GoTrue.
                        local cjson = require("cjson.safe")
                        local types = { signup = true, recovery = true, email_change = true }
                        local function refuse()
                          return kong.response.exit(400, "{}", { ["Content-Type"] = "application/json" })
                        end
                        if kong.request.get_method() ~= "POST" then return refuse() end
                        local body = cjson.decode(kong.request.get_raw_body() or "")
                        if type(body) ~= "table" then return refuse() end
                        for key in pairs(body) do
