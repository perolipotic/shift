            fi
          done
          set +f
          IFS=$saved_ifs
          # Each limit is spliced into YAML as a number: a positive integer, no
          # more than seven digits, and each window no wider than the next.
          positive() {
            case "$2" in
              ''|*[!0-9]*|0*|????????*) echo "kong-entrypoint: $1 is not a positive integer" >&2; exit 1 ;;
            esac
          }
          positive SHIFT_LIMIT_MAIL_HOUR "$SHIFT_LIMIT_MAIL_HOUR"
          positive SHIFT_LIMIT_MAIL_DAY "$SHIFT_LIMIT_MAIL_DAY"
          positive SHIFT_LIMIT_TOKEN_MINUTE "$SHIFT_LIMIT_TOKEN_MINUTE"
          positive SHIFT_LIMIT_TOKEN_HOUR "$SHIFT_LIMIT_TOKEN_HOUR"
          positive SHIFT_LIMIT_VERIFY_MINUTE "$SHIFT_LIMIT_VERIFY_MINUTE"
          positive SHIFT_LIMIT_VERIFY_HOUR "$SHIFT_LIMIT_VERIFY_HOUR"
          positive SHIFT_LIMIT_CREATE_ORGANIZATION_HOUR "$SHIFT_LIMIT_CREATE_ORGANIZATION_HOUR"
          if [ "$SHIFT_LIMIT_MAIL_HOUR" -gt "$SHIFT_LIMIT_MAIL_DAY" ] || [ "$SHIFT_LIMIT_TOKEN_MINUTE" -gt "$SHIFT_LIMIT_TOKEN_HOUR" ] || [ "$SHIFT_LIMIT_VERIFY_MINUTE" -gt "$SHIFT_LIMIT_VERIFY_HOUR" ]; then
