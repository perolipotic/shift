# shift-web (story 20.3; AD-14 as amended): the SPA's one server.
#
# Replaces the base image's `conf.d/default.conf`; the image's own
# `nginx.conf` (pid and temp paths in /tmp, `include conf.d/*.conf`) stays.
#
# HEADERS. `/etc/nginx/shift/security-headers.conf` is rendered at image
# build from the built `dist/_headers`' `/*` block (render-headers.sh): every
# security header, `always`, so errors carry them too. nginx gives a location
# with any `add_header` of its own NONE of the server's, so every location
# includes the file itself. Nothing in this file sets a security header; the
# only header it sets is `Cache-Control`.
#
# CACHE. `/assets/*` is content-hashed: a year, immutable, on a success only
# (no `always`: a 404 is never cached as immutable). Everything else
# (`index.html`, the fallback, `sw.js`, `push-sw.js`, the manifest, the
# icons) is `no-cache`: revalidated on every use, so a deploy is seen at once.
#
# FALLBACK. An unknown path outside `/assets/` is `index.html` with 200, for
# client-side routing. A missing `/assets/…` file is a plain-text 404, never
# `index.html` (a stale chunk name must fail loudly, not parse HTML as
# JavaScript). Every `*.map` is 404; none is in the image anyway.
#
# IPv4 only: a container without IPv6 cannot bind `[::]`, and Traefik reaches
# this container on Docker's network.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Responses nginx makes before choosing a location (a malformed request).
    include /etc/nginx/shift/security-headers.conf;

    location / {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location /assets/ {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @missing;
    }

    # The directory itself: `try_files $uri` would find it as a directory and
    # answer 403 (no index, no autoindex). The same plain 404 as a missing file.
    location = /assets/ {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }

    # The base `mime.types` has no `webmanifest`.
    location = /site.webmanifest {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri @missing;
    }

    # A regex location: checked after the prefixes above, and chosen over
    # them, so `/assets/x.js.map` lands here.
    location ~ \.map$ {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }

    # `types { }`: the 404's type is text/plain whatever the path's extension
    # (`/assets/nope.js` would otherwise be served as JavaScript).
    location @missing {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }
}
